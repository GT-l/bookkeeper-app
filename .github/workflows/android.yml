# =============================================================================
# 少花点儿 App — GitHub Actions 云端构建 Debug APK
# -----------------------------------------------------------------------------
# 源码由 git checkout 直接提供：全部 Kotlin 源文件、Gradle 脚本以及
# gradle/wrapper/gradle-wrapper.jar 均已随 git 推送到 main 分支。
# 修改源码后 push 即生效；不要再使用 ci-src 下的 base64 分块解压覆盖源码，
# 否则新提交的修复会被旧分块还原掉，导致 build.log 与磁盘源码不一致。
# "Verify checked-out sources" 步骤会打印实际参与编译的 KSP 版本与
# @HiltWorker 处理器声明，便于从日志直接确认源码来源。
#
# 用户取结果：打开本仓库的 Actions 页 -> 打开本次 workflow run -> Artifacts 区
#   成功时下载 bookkeeper-debug-apk（内含 app-debug.apk）；
#   失败时下载 build-log 中的 build.log，把内容贴回给主理人以便修复源码。
# =============================================================================

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          # checkout 出的 gradlew 显式补可执行位，避免 core.fileMode 差异导致权限丢失
          chmod +x gradlew
          echo "== source tree from git checkout =="
          ls -la | head -n 30
          echo "== KSP version actually used by this build =="
          grep -n '^ksp = "' gradle/libs.versions.toml
          echo "== HiltWorker KSP processor declaration =="
          grep -nE 'androidx[-.]hilt[-.]compiler' gradle/libs.versions.toml app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        continue-on-error: true
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-asset/bookkeeper-debug.apk"
          echo "== release asset =="
          ls -lh release-asset/

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: 少花点儿 v1.0.0 (Debug APK)
          body: |
            # 少花点儿 · 本次更新

            下载下方 `bookkeeper-debug.apk`（Android 8.0+）覆盖安装即可。

            ## 新增 / 修复

            - **双通道截屏（识屏打通的关键）**：新增无障碍截屏通道（Android 11+ 的 takeScreenshot，**免录屏授权**、重启不失效），优先使用；媒体投影作为兜底。同时补上无障碍配置里缺失的 `canTakeScreenshot` 截屏能力声明——之前 API 30+ 的无障碍截屏根本无法工作。
            - **系统错误码直读**：截屏失败会把系统原始错误码翻译成人话并写日志——太频繁（333ms 节流）、窗口禁止截屏、无障碍权限丢失、显示器无效、系统内部错误，自检页直接展示。
            - **FLAG_SECURE 黑帧识别**：微信/支付宝/银行账单页常开防截屏，截出来是全黑。现在会明确提示「目标页面禁止截屏，属系统限制」，不再误报「OCR 没识别到文字」；同时给出替代方案（手动记 / 支付通知 / 银行短信）。
            - **点自检闪退已修复**：全分辨率抓帧在 2K 屏上瞬时占用 70MB+，内存不足会直接杀进程（OutOfMemoryError 属于 Error，之前的兜底接不住）。现在抓帧缩到最长边 1080、内存态直接交给 OCR，全链路按 Throwable 兜底，自检不再退出 App。
            - **「识屏组件加载失败」已修复**：截屏与 OCR 不再依赖加密文件组件（Keystore），前台服务里构造依赖不会再失败；抓帧不再落盘，更快更稳。
            - **识屏真正打通（关键修复）**：Android 14+ 要求调用截屏 API 前必须有 mediaProjection 类型的前台服务在跑，之前缺这一步 → 授权成功也拿不到投影。现已补齐，并修好截屏监听器线程问题。
            - **识屏失败原因全透明**：新增「识屏自检」页（自动化设置 → 识屏自检 / 查看失败原因）——逐项检查通知权限、截屏授权、截屏、中文 OCR、扣款提取，每项给出结论与修复建议；同时保留最近一次摇一摇识屏的完整步骤与识别文字。
            - **多重提醒**：识屏失败时 Toast 直接说明原因（无授权 / 投影失败 / 取帧超时 / OCR 为空 / 未找到金额…），进度通知标题同样写明原因，并按原因给出下一步怎么做。
            - **缺授权自动续跑**：摇一摇发现没有截屏授权时，自动拉起授权页；授权成功后自动继续识屏，不用再摇第二次。被系统拦下则发「去授权」通知兜底。
            - **识屏从未成功已修复**：OCR 换用中文离线模型（原拉丁模型识别不了中文支付页）；截屏监听器改挂主线程 Looper（原 IO 线程无 Looper，截屏永远超时）。
            - **智能扣款识别**：新算法对整屏文字做候选打分——「实付/付款金额/交易金额」标签、货币符号、支付成功状态加权，订单号/卡号/手机号硬性淘汰；商户按「收款方/商户」标签与后缀词识别，多金额同屏自动选最可能的一笔。
            - **识屏进度可视化（灵动岛适配）**：摇一摇识屏全程投递进行中通知（截屏→识别→提取→结果）；小米焦点通知 / 华为·荣耀实况窗 / OPPO 流体云会自动聚合成屏幕顶部胶囊，其余 ROM 显示通知栏进度。
            - **通知权限专项加固**：所有通知投递统一走安全守卫——未授权通知时先跳过再兜底，杜绝部分机型（尤其国产 ROM）上「开通知权限后闪退 / 主线程被阻塞」的已知问题。
            - **OrangeOS / ColorOS 特调**：新增 ROM 识别与设置页引导卡（自启动 / 通知 / 电池三项必开）；权限弹窗刚关闭时服务启动失败会自动延迟重试，回到设置页也会补拉。
            - **通知渠道冲突修复**：摇一摇常驻通知改用独立低打扰渠道，不再与自动化服务、校对通知抢渠道（修复「有时响铃有时静音」的不稳定表现）。
            - **无障碍服务再加固**：手势兜底通知同样套防崩守卫，杜绝读屏服务因通知异常被系统禁用（Orange 7 实测症状）。
            - **修好「识屏组件不可用」**：摇一摇的识屏改为轻量实现（截屏→OCR→自动预填金额/商家→打开表单确认），不再依赖重型识别管线；识别失败直接打开空表单手动输入。
            - **权限设置不再退出 App**：系统权限页改为在当前任务栈打开，授权完返回直接回到设置页（之前带 NEW_TASK 会新建任务栈，返回就回桌面像退出了一次）。
            - **常驻通知可定制**：专用通知布局，简洁 / 明细 / 大字三种样式；今日支出、本月支出、预算剩余、最近一笔、今日笔数、记一笔按钮、悬浮球显隐都能自己勾。
            - **悬浮球拖拽修正**：跟随手指方向（之前左右相反），拖动后不再误打开表单；通知按钮可快速显示 / 隐藏。
            - **升级自动清理**：清掉旧版本遗留的识屏截图、崩溃日志、过期备份与缓存，不动账单数据。
            - **提示精简**：App 内只留「能做什么」，详细边界见 README。
            - **稳定性**：悬浮层独立进程 + 安全模式熔断，ROM 拦截悬浮球也不会导致 App 打不开。

            ## 能做什么

            - 手动记支出 / 收入 / 转账；按日分组、搜索筛选、周期账单、多账本、分类标签、账户余额联动。
            - 四条本地识别通道：支付完成页读屏、支付通知、银行扣款短信、截屏 OCR；识别不清时弹窗确认。
            - 一键记一笔：桌面图标、小组件、常驻通知、悬浮球、系统手势。
            - 预算、7 个统计视图、CSV / XLSX 导入导出、本地备份恢复；SQLCipher 加密，全本地不联网。

            标准 Android 沙盒内做不到的（全局交易事件、强杀后无条件自启等）没有实现；识别不到时用「记一笔」补记即可。

            ---
            构建：`${{ github.ref_name }}` · `${{ github.sha }}` · 96 个单元测试随 CI 执行。
          files: release-asset/bookkeeper-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
