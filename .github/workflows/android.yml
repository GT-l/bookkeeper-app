# =============================================================================
# 少花点儿 App — GitHub Actions 云端构建 Debug APK
# -----------------------------------------------------------------------------
# 源码由 git checkout 直接提供：全部 Kotlin 源文件、Gradle 脚本以及
# gradle/wrapper/gradle-wrapper.jar 均已随 git 推送到 main 分支。
# 修改源码后 push 即生效；不要再使用 ci-src 下的 base64 分块解压覆盖源码，
# 否则新提交的修复会被旧分块还原掉，导致 build.log 与磁盘源码不一致。
# "Verify checked-out sources" 步骤会打印实际参与编译的 KSP 版本与
# @HiltWorker 处理器声明，便于从日志直接确认源码来源。
#
# 用户取结果：打开本仓库的 Actions 页 -> 打开本次 workflow run -> Artifacts 区
#   成功时下载 bookkeeper-debug-apk（内含 app-debug.apk）；
#   失败时下载 build-log 中的 build.log，把内容贴回给主理人以便修复源码。
# =============================================================================

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          # checkout 出的 gradlew 显式补可执行位，避免 core.fileMode 差异导致权限丢失
          chmod +x gradlew
          echo "== source tree from git checkout =="
          ls -la | head -n 30
          echo "== KSP version actually used by this build =="
          grep -n '^ksp = "' gradle/libs.versions.toml
          echo "== HiltWorker KSP processor declaration =="
          grep -nE 'androidx[-.]hilt[-.]compiler' gradle/libs.versions.toml app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Static consistency tests (v1.3.1)
        shell: bash
        run: python3 scripts/verify_v1_3_1.py

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      # 统计结果写进 artifact 名：公开 API 无需认证就能读到，方便核对「绿色」是否掩盖失败
      - name: Summarize unit tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          summary = "T%d-F%d-E%d-S%d" % (tests, failures, errors, skipped)
          failed_names = []
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_names.append(case.get("name", "?"))
          if failed_names:
              summary += "-FAIL_" + "_".join(failed_names[:2]).replace(" ", "")[:60]
          print("UNIT TEST SUMMARY:", summary)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("TEST_SUMMARY=%s\n" % summary)
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-asset/bookkeeper-debug.apk"
          echo "== release asset =="
          ls -lh release-asset/

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1-debug
          name: 少花点儿 v1.3.1 (Debug APK)
          body: |
            # 少花点儿 v1.3.1 · 静默入账、轻弹窗与自动更新

            下载 `bookkeeper-debug.apk`（Android 8.0+）覆盖安装即可。账单数据仍只存本机；只有你在关于页点「检查更新」时才会联网。

            ## 本版修复（全部来自真机反馈）

            - **不再每次都问「是否记账」**：识别把握够（金额 + 有效商户）就直接入账，随后弹一张 3 秒自动消失的底部轻卡片「✓ 记账成功」；只有商户没抽到、把握低时才弹轻确认。
            - **修好「只识别到『支付』两个字的回归」**：上一版遍历后 `child.recycle()`，而多个根节点共享同一子树，第一次回收后后面的遍历只剩根节点标题。现在统一到 `ScreenTextCollector`：整页优先、按行去重、不回收共享节点。
            - **摇一摇与自动识屏结果不再不一致**：两条链路现在共用同一采集/去重/微信标签补齐入口，且自动链路也用 `PaymentTextAnalyzer` 抽商户与购买内容，备注统一写成「商户 · 购买内容」。这同时让跨链路重复能被识别出来。
            - **打开同一笔付款记录也能触发重复提醒**：账单详情页过去被直接丢弃，现在会提交去重；确定重复弹「这笔已记过，已跳过」轻提示，疑似重复弹底部轻卡片，不再落通知栏、不再拉起软件界面。
            - **抖音订单页识别修复**：支持只有「实付 ¥xx + 订单详情」而没有「支付成功」的页面，并补上金额/商户标签行。
            - **所有反馈轻打扰**：成功、重复、低置信度确认统一走屏幕底部轻卡片；进度/结果通知不再常驻，兜底横幅 8 秒自动消失。轻卡片优先用 `TYPE_ACCESSIBILITY_OVERLAY`，**不需要悬浮窗权限**。
            - **无障碍长时间运行后被系统关闭**：新增静默前台守护服务（IMPORTANCE_MIN，不弹横幅），每 60 秒检查系统开关；授予 `WRITE_SECURE_SETTINGS` 后自动写回恢复，未授予时限频弹底部轻提示。ADB 一键脚本新增 `grant` / `restore`。
            - **关于页自动更新**：点「检查 GitHub 更新」→ 拉取 Releases → 有新版本自动下载 APK → 拉起系统安装器（系统不允许无声安装，最后一步需点「安装」；同签名覆盖不丢账单）。

            ## 关于无障碍自动恢复
            普通安装没有签名级权限，守护只能检测并轻提醒。想让它自动恢复，电脑连手机跑一次：
            `bash scripts/android_unlock_accessibility.sh restore`
            （USB 调试即可，无需 root；或直接用 Shizuku 给 App 授权。）

            ## 隐私
            账单、账户、分类用 SQLCipher 加密后只存在本机，无账号、无服务端、不上传任何账单内容。更新检查只读取 GitHub 公开 Releases。

            反馈请附：机型 + Android 版本 + 自动化设置的「复制 log」（新日志带 `len=` / `preview=` / 页面类型）。

          files: release-asset/bookkeeper-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 编译失败时把 Kotlin 错误首行写进 artifact 名，公开 API 无需认证即可定位
      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          text = ""
          if os.path.isfile("build.log"):
              with open("build.log", encoding="utf-8", errors="ignore") as f:
                  text = f.read()
          errors = re.findall(r"^e: file:///.+$", text, re.M) or re.findall(r"^e: .+", text, re.M)
          if errors:
              matched = re.match(r"^e: file:///(\S+?):(\d+):(\d+): (.*)$", errors[0])
              if matched:
                  msg = "%s_L%s_%s" % (
                      os.path.basename(matched.group(1)), matched.group(2), matched.group(4)[:55]
                  )
              else:
                  msg = errors[0][:200]
          else:
              msg = "unknown-compile-error"
          msg = re.sub(r"[^A-Za-z0-9\u4e00-\u9fff_.\-]", "", msg)[:220]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("BUILD_ERROR=%s\n" % msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Build errors\n\n```\n" + "\n".join(errors[:8]) + "\n```\n")
          print("BUILD ERROR:", msg)
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_ERROR }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ env.TEST_SUMMARY }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
