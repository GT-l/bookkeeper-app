# =============================================================================
# 少花点儿 App — GitHub Actions 云端构建 Debug APK
# -----------------------------------------------------------------------------
# 源码由 git checkout 直接提供：全部 Kotlin 源文件、Gradle 脚本以及
# gradle/wrapper/gradle-wrapper.jar 均已随 git 推送到 main 分支。
# 修改源码后 push 即生效；不要再使用 ci-src 下的 base64 分块解压覆盖源码，
# 否则新提交的修复会被旧分块还原掉，导致 build.log 与磁盘源码不一致。
# "Verify checked-out sources" 步骤会打印实际参与编译的 KSP 版本与
# @HiltWorker 处理器声明，便于从日志直接确认源码来源。
#
# 用户取结果：打开本仓库的 Actions 页 -> 打开本次 workflow run -> Artifacts 区
#   成功时下载 bookkeeper-debug-apk（内含 app-debug.apk）；
#   失败时下载 build-log 中的 build.log，把内容贴回给主理人以便修复源码。
# =============================================================================

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          # checkout 出的 gradlew 显式补可执行位，避免 core.fileMode 差异导致权限丢失
          chmod +x gradlew
          echo "== source tree from git checkout =="
          ls -la | head -n 30
          echo "== KSP version actually used by this build =="
          grep -n '^ksp = "' gradle/libs.versions.toml
          echo "== HiltWorker KSP processor declaration =="
          grep -nE 'androidx[-.]hilt[-.]compiler' gradle/libs.versions.toml app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Static consistency tests (v1.2.3)
        shell: bash
        run: python3 scripts/verify_v1_2_3.py

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      # 统计结果写进 artifact 名：公开 API 无需认证就能读到，方便核对「绿色」是否掩盖失败
      - name: Summarize unit tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          summary = "T%d-F%d-E%d-S%d" % (tests, failures, errors, skipped)
          failed_names = []
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_names.append(case.get("name", "?"))
          if failed_names:
              summary += "-FAIL_" + "_".join(failed_names[:2]).replace(" ", "")[:60]
          print("UNIT TEST SUMMARY:", summary)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("TEST_SUMMARY=%s\n" % summary)
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-asset/bookkeeper-debug.apk"
          echo "== release asset =="
          ls -lh release-asset/

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3-debug
          name: 少花点儿 v1.2.3 (Debug APK)
          body: |
            # 少花点儿 v1.2.3

            下载 `bookkeeper-debug.apk`（Android 8.0+）覆盖安装即可。纯本地记账，不联网、不上云。

            ## 本版重点：针对「无障碍开关秒关」的根因
            第二轮真机日志（vivo V2505A / Android 17 API 37）给出决定性证据：连接 6 次、被撤销 4 次，但 pid 始终是 23522、进程已运行 3.4 分钟 —— 进程根本没被杀。安装来源 `com.android.packageinstaller` 说明是手动装 APK 的侧载。

            - **纠正排查方向**：上一版把后台保活 / 电池白名单放在第一位，方向错了。进程没死时这些设置无效；现在诊断会直接写明「pid 稳定，不要再往保活方向排查」。
            - **补上侧载识别**：`com.android.packageinstaller` 过去被当成正常来源，导致结论没提「受限设置」。现在识别为侧载，并把 Android 13+「受限设置」与 Android 17「高级保护模式」列为首要嫌疑。
            - **给确定性解法**：新增 `scripts/android_unlock_accessibility.sh`（status / unlock / check），用 adb 一次性解除受限设置，无需 root；完整命令也写进 App 内「复制稳定运行说明」，手机上可直接复制。
            - **服务声明最小权限化**：移除 `packageNames`（原样列出微信 / 支付宝 / 银行包名，最容易触发支付风控；事件过滤本来就在代码里做）与 `canTakeScreenshot`（默认关闭的实验通道，兜底还有媒体投影 / OCR）。读节点主链路与指纹手势不受影响。
            - **诊断增强**：报告新增「进程 pid 是否稳定」「安装来源（侧载）」「截屏能力 false 属预期」；自检页不再把无截屏能力显示成故障。
            - **关于页**：补上 v1.2.3 更新介绍。

            ## 装完请先做这两步
            1. 设置 → 安全 → 高级保护模式：确认关闭。
            2. 设置 → 应用管理 → 少花点儿 → 右上角 ⋮ → 允许受限设置；找不到菜单就执行上面的 adb 命令。
            然后回 设置 → 快捷与辅助 → 无障碍 → 已下载的服务 打开开关，静置 5 分钟。

            ## 历史版本
            v1.2.2 诊断自动判因与 vivo 引导可见性；v1.2.1 无障碍健康检查与固定调试签名；v1.2.0 统计与记账闭环。

            ## 隐私
            数据用 SQLCipher 加密后只存在本机，无账号、无服务端、不采集任何信息。

            反馈请附：机型 + Android 版本 + 自动化设置的「复制 log」。

          files: release-asset/bookkeeper-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 编译失败时把 Kotlin 错误首行写进 artifact 名，公开 API 无需认证即可定位
      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          text = ""
          if os.path.isfile("build.log"):
              with open("build.log", encoding="utf-8", errors="ignore") as f:
                  text = f.read()
          errors = re.findall(r"^e: file:///.+$", text, re.M) or re.findall(r"^e: .+", text, re.M)
          if errors:
              matched = re.match(r"^e: file:///(\S+?):(\d+):(\d+): (.*)$", errors[0])
              if matched:
                  msg = "%s_L%s_%s" % (
                      os.path.basename(matched.group(1)), matched.group(2), matched.group(4)[:55]
                  )
              else:
                  msg = errors[0][:200]
          else:
              msg = "unknown-compile-error"
          msg = re.sub(r"[^A-Za-z0-9\u4e00-\u9fff_.\-]", "", msg)[:220]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("BUILD_ERROR=%s\n" % msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Build errors\n\n```\n" + "\n".join(errors[:8]) + "\n```\n")
          print("BUILD ERROR:", msg)
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_ERROR }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ env.TEST_SUMMARY }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
