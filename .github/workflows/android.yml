# =============================================================================
# 少花点儿 App — GitHub Actions 云端构建 Debug APK
# -----------------------------------------------------------------------------
# 源码由 git checkout 直接提供：全部 Kotlin 源文件、Gradle 脚本以及
# gradle/wrapper/gradle-wrapper.jar 均已随 git 推送到 main 分支。
# 修改源码后 push 即生效；不要再使用 ci-src 下的 base64 分块解压覆盖源码，
# 否则新提交的修复会被旧分块还原掉，导致 build.log 与磁盘源码不一致。
# "Verify checked-out sources" 步骤会打印实际参与编译的 KSP 版本与
# @HiltWorker 处理器声明，便于从日志直接确认源码来源。
#
# 用户取结果：打开本仓库的 Actions 页 -> 打开本次 workflow run -> Artifacts 区
#   成功时下载 bookkeeper-debug-apk（内含 app-debug.apk）；
#   失败时下载 build-log 中的 build.log，把内容贴回给主理人以便修复源码。
# =============================================================================

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          # checkout 出的 gradlew 显式补可执行位，避免 core.fileMode 差异导致权限丢失
          chmod +x gradlew
          echo "== source tree from git checkout =="
          ls -la | head -n 30
          echo "== KSP version actually used by this build =="
          grep -n '^ksp = "' gradle/libs.versions.toml
          echo "== HiltWorker KSP processor declaration =="
          grep -nE 'androidx[-.]hilt[-.]compiler' gradle/libs.versions.toml app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        continue-on-error: true
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-asset/bookkeeper-debug.apk"
          echo "== release asset =="
          ls -lh release-asset/

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: 少花点儿 v1.0.0 (Debug APK)
          body: |
            # 少花点儿 · 本次更新

            下载下方 `bookkeeper-debug.apk`（Android 8.0+）覆盖安装即可。

            ## 新增 / 修复

            - **系统手势替代三指条**：移除会吞触摸的底部手势条，改为按机型能力自选指纹四向滑动 / 摇一摇 / 无障碍按钮；设置 → 快捷手势里选。
            - **常驻通知可定制**：专用通知布局，简洁 / 明细 / 大字三种样式；今日支出、本月支出、预算剩余、最近一笔、今日笔数、记一笔按钮、悬浮球显隐都能自己勾。
            - **悬浮球拖拽修正**：跟随手指方向（之前左右相反），拖动后不再误打开表单；通知按钮可快速显示 / 隐藏。
            - **升级自动清理**：清掉旧版本遗留的识屏截图、崩溃日志、过期备份与缓存，不动账单数据。
            - **提示精简**：App 内只留「能做什么」，详细边界见 README。
            - **稳定性**：悬浮层独立进程 + 安全模式熔断，ROM 拦截悬浮球也不会导致 App 打不开。

            ## 能做什么

            - 手动记支出 / 收入 / 转账；按日分组、搜索筛选、周期账单、多账本、分类标签、账户余额联动。
            - 四条本地识别通道：支付完成页读屏、支付通知、银行扣款短信、截屏 OCR；识别不清时弹窗确认。
            - 一键记一笔：桌面图标、小组件、常驻通知、悬浮球、系统手势。
            - 预算、7 个统计视图、CSV / XLSX 导入导出、本地备份恢复；SQLCipher 加密，全本地不联网。

            标准 Android 沙盒内做不到的（全局交易事件、强杀后无条件自启等）没有实现；识别不到时用「记一笔」补记即可。

            ---
            构建：`${{ github.ref_name }}` · `${{ github.sha }}` · 96 个单元测试随 CI 执行。
          files: release-asset/bookkeeper-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
