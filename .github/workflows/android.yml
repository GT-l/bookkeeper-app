# =============================================================================
# 少花点儿 App — GitHub Actions 云端构建 Debug APK
# -----------------------------------------------------------------------------
# 源码由 git checkout 直接提供：全部 Kotlin 源文件、Gradle 脚本以及
# gradle/wrapper/gradle-wrapper.jar 均已随 git 推送到 main 分支。
# 修改源码后 push 即生效；不要再使用 ci-src 下的 base64 分块解压覆盖源码，
# 否则新提交的修复会被旧分块还原掉，导致 build.log 与磁盘源码不一致。
# "Verify checked-out sources" 步骤会打印实际参与编译的 KSP 版本与
# @HiltWorker 处理器声明，便于从日志直接确认源码来源。
#
# 用户取结果：打开本仓库的 Actions 页 -> 打开本次 workflow run -> Artifacts 区
#   成功时下载 bookkeeper-debug-apk（内含 app-debug.apk）；
#   失败时下载 build-log 中的 build.log，把内容贴回给主理人以便修复源码。
# =============================================================================

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 同一分支只保留最新一次构建。两次 run 同时创建 v1.3.x-debug 会互相覆盖资产，
# 更糟的是旧 commit 的包可能先发布成功，被用户当成本轮结果下载。
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          # checkout 出的 gradlew 显式补可执行位，避免 core.fileMode 差异导致权限丢失
          chmod +x gradlew
          echo "== source tree from git checkout =="
          ls -la | head -n 30
          echo "== KSP version actually used by this build =="
          grep -n '^ksp = "' gradle/libs.versions.toml
          echo "== HiltWorker KSP processor declaration =="
          grep -nE 'androidx[-.]hilt[-.]compiler' gradle/libs.versions.toml app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Static consistency tests (v1.3.16)
        shell: bash
        run: python3 scripts/verify_v1_3_16.py

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      # 统计结果写进 artifact 名：公开 API 无需认证就能读到，方便核对「绿色」是否掩盖失败
      - name: Summarize unit tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          summary = "T%d-F%d-E%d-S%d" % (tests, failures, errors, skipped)
          failed_names = []
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_names.append(case.get("name", "?"))
          if failed_names:
              summary += "-FAIL_" + "_".join(failed_names[:2]).replace(" ", "")[:60]
          print("UNIT TEST SUMMARY:", summary)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("TEST_SUMMARY=%s\n" % summary)
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-asset/bookkeeper-debug.apk"
          echo "== release asset =="
          ls -lh release-asset/

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.16-debug
          name: 少花点儿 v1.3.16 (Debug APK)
          body: |
            # 少花点儿 v1.3.16

            下载 `bookkeeper-debug.apk`（Android 8.0+）覆盖安装即可，账单不丢。

            ## 识屏（本版重点）
            真机日志（realme RMX3888 / Android 37，15:56:13）：无障碍截屏「成功 1264x2780」→
            OCR「识别完成 0 字 blocks=0」→ 报「没找到扣款金额」。说明系统给的是**空白帧**，
            而旧的黑帧判定只看平均亮度 < 8，全白 / 全灰帧全漏过去，空图被丢给 OCR，
            最后把原因显示成「当前页可能不是支付结果页」。

            - 帧体检升级：采样 32×64 点算亮度均值 / 最暗 / 最亮 / 近黑近白占比，
              亮暗跨度 < 12 即判定为单色帧（全黑、全白、全灰都算），统计直接写日志。
            - 单色帧不再进 OCR，直接让给媒体投影通道；两条都空时明确报「空白帧」，
              并主动引导一次录屏授权（以前 captureChannelReady() 为 true 就拒绝引导，用户无路可走）。
            - OCR 引擎异常与「页面没有文字」彻底分开：跨进程回传 error，
              日志显示「识别异常 原因=…」，不再统一变成 0 字。
            - 0 字结果带帧体统计数据，下次贴 log 就能判断是图空还是模型没识别出来。

            ## 关于无障碍被系统关闭
            log 里 `kind=closed ... source=com.android.packageinstaller revokeCount=8` 说明：
            是**安装 APK 时系统（PackageInstaller / 权限管理）主动关掉了无障碍开关**，不是 App 自己关的。
            每次覆盖安装后需要在「设置 → 无障碍」重新打开一次；App 侧已做守护检测 + 通知提醒。

            ## 下载（沿用 v1.3.15）
            - 断点续传：代理抖动不再从 0 重下 88MB，重试接着下；进程被杀也保留进度。
            - 进度显示「已下 / 总量 · 实时速率 · 剩余时间」，不再长时间停在 0%。
            - 直链优先（少一跳），API asset 仅兜底；下载期间暂停识屏截图 OCR，不与下载抢 CPU。

            ## 说明
            - 体积仍是 88MB：未做 ABI 裁剪，四个架构全打包（保留多机型兼容）。

            ## 隐私
            账单数据只存本机，不上传。检查更新只读取公开 Releases。

            反馈请附：机型 + Android 版本 + 自动化设置的「复制 log」。

          files: release-asset/bookkeeper-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 编译失败时把 Kotlin 错误首行写进 artifact 名，公开 API 无需认证即可定位
      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          text = ""
          if os.path.isfile("build.log"):
              with open("build.log", encoding="utf-8", errors="ignore") as f:
                  text = f.read()
          errors = re.findall(r"^e: file:///.+$", text, re.M) or re.findall(r"^e: .+", text, re.M)
          if errors:
              matched = re.match(r"^e: file:///(\S+?):(\d+):(\d+): (.*)$", errors[0])
              if matched:
                  msg = "%s_L%s_%s" % (
                      os.path.basename(matched.group(1)), matched.group(2), matched.group(4)[:55]
                  )
              else:
                  msg = errors[0][:200]
          else:
              msg = "unknown-compile-error"
          msg = re.sub(r"[^A-Za-z0-9\u4e00-\u9fff_.\-]", "", msg)[:220]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("BUILD_ERROR=%s\n" % msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Build errors\n\n```\n" + "\n".join(errors[:8]) + "\n```\n")
          print("BUILD ERROR:", msg)
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_ERROR }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ env.TEST_SUMMARY }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
