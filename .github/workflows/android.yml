# =============================================================================
# 少花点儿 App — GitHub Actions 云端构建 Debug APK
# -----------------------------------------------------------------------------
# 源码由 git checkout 直接提供：全部 Kotlin 源文件、Gradle 脚本以及
# gradle/wrapper/gradle-wrapper.jar 均已随 git 推送到 main 分支。
# 修改源码后 push 即生效；不要再使用 ci-src 下的 base64 分块解压覆盖源码，
# 否则新提交的修复会被旧分块还原掉，导致 build.log 与磁盘源码不一致。
# "Verify checked-out sources" 步骤会打印实际参与编译的 KSP 版本与
# @HiltWorker 处理器声明，便于从日志直接确认源码来源。
#
# 用户取结果：打开本仓库的 Actions 页 -> 打开本次 workflow run -> Artifacts 区
#   成功时下载 bookkeeper-debug-apk（内含 app-debug.apk）；
#   失败时下载 build-log 中的 build.log，把内容贴回给主理人以便修复源码。
# =============================================================================

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          # checkout 出的 gradlew 显式补可执行位，避免 core.fileMode 差异导致权限丢失
          chmod +x gradlew
          echo "== source tree from git checkout =="
          ls -la | head -n 30
          echo "== KSP version actually used by this build =="
          grep -n '^ksp = "' gradle/libs.versions.toml
          echo "== HiltWorker KSP processor declaration =="
          grep -nE 'androidx[-.]hilt[-.]compiler' gradle/libs.versions.toml app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        continue-on-error: true
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-asset/bookkeeper-debug.apk"
          echo "== release asset =="
          ls -lh release-asset/

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-debug
          name: 少花点儿 v1.0.0 (Debug APK)
          body: |
            # 少花点儿 · 本次更新

            下载下方 `bookkeeper-debug.apk`（Android 8.0+）覆盖安装即可。

            ## 新增 / 修复

            - **输入框全面美化（本轮）**：新增统一输入组件——标签移到框上方、聚焦时描边渐变到主色、填充式圆角容器、左侧小图标；金额输入独立做成一张卡片（¥ 前缀 + 34sp 等宽大字 + 右侧「元」）。已替换记账页的金额/时间/备注三个输入框与搜索页搜索框（其它页面样式保持不变）。
            - **疑似重复交给你决定（本轮）**：识屏自动记账前先查近 24 小时内「同商户 + 同金额」的账单。命中时**不写库也不丢单**，弹一张卡片写明「已有一笔：11-26 10:32 · ¥19.00 · 瑞幸咖啡」，给你三个出口——不记了 / 修改 / 仍然记账；点遮罩也能放弃。以前是默默记一笔，现在是否重复由你拍板。
            - **购买内容识别（本轮）**：从支付结果页里识别「商品说明 / 商品名称 / 订单标题 / 购买内容 / 转账说明」等字段，认到了就一并写进备注（如「瑞幸咖啡 · 生椰拿铁」）。认不出来就当没有，**不弹窗、不确认、不打扰**；「商品总价」「订单号」这类不会误当商品名。
            - **识屏改成三档：能自动就自动**：置信度 ≥0.8（金额+商户同时命中）→ **直接记账**，只弹一条「记账成功 ¥xx · 商户」提示，不需要你确认；0.5~0.8（只拿到金额）→ **弹一张小卡片**确认，一颗按钮就记完，不再把你丢进完整表单；更低或写入失败才打开表单。
            - **新增轻确认弹窗**：只显示「金额（大字）+ 商户 + 确认记账 / 修改」，点遮罩即取消，不打断当前操作。
            - **自动归类**：按商户关键词自动选支出分类（餐饮/购物/交通/娱乐/医疗/生活），匹配不到用默认支出分类，再不行用「其他」。账本取默认账本，账户取默认账户。
            - **全站视觉统一**：新增 `AppTopBar`（透明底 + 加粗标题 + 可选副标题），16 个页面顶栏统一，露出版面上的奶油粉渐变；首页概览卡改为渐变主卡，支出做成大字主体，收入/结余退为次级信息。
            - **修复「一点就闪退」的真正根因（本轮重点）**：跟截屏完全无关，是正则。商户识别正则里的 `[^\s，。；;：:]{2,30}` 在 Android 17（realme）的 ICU 上被判为「Incorrect Unicode property」，而它写在类的**静态初始化**里 → 整个类初始化失败 → 任何注入它的页面（识屏自检）一创建就崩。崩溃栈：`PatternSyntaxException ... at PaymentTextAnalyzer.<clinit>`。
            - **全仓正则加固**：`PaymentTextAnalyzer` / `FieldExtractor` / `BankSmsRule` / `AccountMatcher` 四处的正则统一走 `SafeRegex` 安全编译，字符类里不再出现 `\s`。今后某条正则在本机编译失败，只降级为「该规则不匹配」，**绝不再拖垮进程**。
            - **识屏主链路换代（本轮核心）**：参考钱迹等主流记账 App——它们的 Android 自动记账走的是「无障碍读页面节点文字」，不是截图 OCR。我们已切到同一条路：摇一摇/悬浮球命中后直接读当前页面节点树里的金额与商户，**不需要录屏授权、不受「页面禁止截屏 FLAG_SECURE」影响、不会 native 崩溃**。截图 OCR 降级为兜底，只有节点读不到金额时才尝试。
            - **自检页新增「读屏节点」体检**：点「环境检查（安全）」就能看到读到了多少个文本节点、多少字、是哪个页面——这就是识屏能不能用的直接证据，且全程不截屏、不会闪退。
            - **闪退现在必有证据（本轮核心）**：新增「崩溃探针」——在 App 启动、页面打开、点按钮、无障碍服务连接/解绑等每个关键点前后各写一行到本地。Java 崩溃有完整栈；native 崩溃或被系统直接杀进程这类抓不到栈的情况，也能看到「最后执行到哪一步」。
            - **启动即弹崩溃栈**：只要发生过闪退，下次打开 App 第一眼就弹出崩溃栈并支持一键复制——不再把栈藏在自检页里（自检页本身可能就是崩的那一环）。
            - **零依赖日志页**：设置 → 管理 → 「崩溃日志（一键复制，不依赖任何组件）」。用最原始的 Activity + TextView 实现，不用 Compose、不用 Hilt、不碰截屏与 OCR，保证「只要 App 能打开，就一定能打开它」。
            - **无障碍服务全回调兜底**：`onServiceConnected` 整体加异常保护——系统绑定阶段一旦抛异常，ROM 会直接把服务禁用，用户看到的就是「刚打开无障碍、几秒后又自动关掉」。连接 / 解绑 / 销毁全部留痕。
            - **自检页零崩溃改造**：ViewModel 构造与每一项检查独立兜底，某项读不到系统状态只让该项变红；组合期不再读磁盘。
            - **无障碍截屏改为「默认关闭」的实验开关**：参考 CircleToSearch、accessibility-sample 等开源实现后确认——该通道在部分国产 ROM 上会 native 崩溃，Java 层接不住。既然接不住就不默认开启，识屏改走稳定的媒体投影；想试可在自动化设置里手动打开「无障碍截屏（实验）」，真崩了会自动熔断停用。
            - **日志入口前置**：设置页新增「识屏诊断与日志（可复制）」；自检页第一屏就有「① 复制全部（诊断 + 日志）」，不用再往下翻。
            - **全链路闪退自查**：通知监听服务 / 开机广播 / 短信接收器 / 前台服务全部改为惰性依赖（不再字段注入）；无障碍事件解析移出主线程（防 ANR 被 ROM 禁用）；协程、onDestroy、强转全部兜底。
            - **识屏日志系统**：开启识屏后自动记录全链路（通道、错误码、OCR、提取、服务连接），256KB 封顶，可预览/复制/清空。
            - **截屏通道熔断**：某通道导致崩溃后自动停用并写明原因，不会反复闪退；自检页可手动恢复。
            - **无障碍不再被 ROM 自动关掉**：无障碍事件里的节点树深度遍历从主线程移到 IO 线程。主线程卡顿会被判 ANR，系统随即禁用无障碍服务——这是 OrangeOS 上「开完无障碍没一会儿自动取消」的关键成因之一。
            - **异常全兜底**：前台服务 onDestroy 的落盘、服务内协程、探活 Worker 全部加 runCatching；MediaProjectionManager / WindowManager 强转改为安全获取，避免个别 ROM 上返回 null 直接崩。
            - **一键复制**：识屏自检页底部「识屏日志」卡片可预览最近 20 行、复制最近 400 行、清空；「复制诊断信息」现在也附带最近 200 行日志，直接粘贴即可定位问题。
            - **自检默认不截屏**：主按钮改为「环境检查（安全）」——查通知权限、无障碍连接与截屏能力、两条通道状态，完全不截屏；真实截屏单独一个按钮，明确标注「可能崩溃，已加熔断保护」。
            - **错误码补齐**：映射系统 `ERROR_TAKE_SCREENSHOT_SECURE_WINDOW(6)`，FLAG_SECURE 页面直接给结论。
            - **测试全绿**：新增通道准入单测；把余额计算抽成 `BalanceMath` 并改为直接调用生产逻辑（原反射测试有 14 个一直失败、被 CI 的 continue-on-error 掩盖），现在 **107 个单测全部通过**。
            - **自检闪退现在能查了**：新增全局崩溃捕获——任何 Java 崩溃都会把机型/进程/完整堆栈写进本地文件，自检页顶部直接显示「最近一次崩溃记录」，点「复制诊断信息」连栈一起带走。再也不用盲猜。
            - **安全模式自检**：新增「仅环境检查（安全模式，不截屏）」按钮，完全不碰截屏也能看通道状态；如果上次崩在截屏步骤，再点「开始自检」会自动降级为安全模式，避免反复闪退。
            - **截屏调用改主线程**：无障碍 takeScreenshot 统一在主线程发起，避免线程约束引发的系统级异常。
            - **自检实时监督**：点「开始自检」后顶部出现进度卡片，实时显示「正在截屏 / 正在 OCR / 正在提取」，每一项跑完立即出现在结果列表（不再等全部结束才刷新）。
            - **摇一摇即时提醒**：命中瞬间双脉冲震动 + Toast「摇一摇已触发 · 正在识屏…」——不依赖通知权限也能感知；有通知权限时进度通知、小米/华为/OPPO 的顶部胶囊同步显示。
            - **自检不再杀进程（进程隔离）**：ML Kit 识别是原生库，异常图像/机型兼容问题会 native 崩溃，Java 层兜不住。现在 OCR 全部放到 `:ocr` 独立进程执行，最坏只崩子进程；主程序与自检页面存活，并明确提示「OCR 进程崩溃/无响应」。
            - **自检分步落盘**：环境检查 → 截屏 → OCR → 扣款提取，每步开始前写盘标记；若某步把进程干掉，下次打开自检页会直接显示「上次自检在『OCR』步骤被系统终止」，真正实现自查。
            - **内存再收紧**：无障碍截屏返回的全分辨率位图（2K 屏约 18MB）统一缩到最长边 1080 再识别，低端机不再因内存被系统杀。
            - **无障碍服务「启动失败」根因修复**：清单里无障碍服务写成了 `android:exported="false"`，系统（system_server）跨进程绑定会被拒 → 服务永远连不上。已改为 `true`（安全性由 BIND_ACCESSIBILITY_SERVICE 权限保证）；同时补上 `Log.w` 连接/解绑日志与 R8 保活规则（防混淆把服务类名删掉）。
            - **诊断可一键导出**：识屏自检页新增「复制诊断信息」——机型/系统版本/无障碍是否连接/截屏能力/两条通道状态/最近一次失败步骤，一次复制即可反馈。
            - **双通道截屏（识屏打通的关键）**：新增无障碍截屏通道（Android 11+ 的 takeScreenshot，**免录屏授权**、重启不失效），优先使用；媒体投影作为兜底。同时补上无障碍配置里缺失的 `canTakeScreenshot` 截屏能力声明——之前 API 30+ 的无障碍截屏根本无法工作。
            - **系统错误码直读**：截屏失败会把系统原始错误码翻译成人话并写日志——太频繁（333ms 节流）、窗口禁止截屏、无障碍权限丢失、显示器无效、系统内部错误，自检页直接展示。
            - **FLAG_SECURE 黑帧识别**：微信/支付宝/银行账单页常开防截屏，截出来是全黑。现在会明确提示「目标页面禁止截屏，属系统限制」，不再误报「OCR 没识别到文字」；同时给出替代方案（手动记 / 支付通知 / 银行短信）。
            - **点自检闪退已修复**：全分辨率抓帧在 2K 屏上瞬时占用 70MB+，内存不足会直接杀进程（OutOfMemoryError 属于 Error，之前的兜底接不住）。现在抓帧缩到最长边 1080、内存态直接交给 OCR，全链路按 Throwable 兜底，自检不再退出 App。
            - **「识屏组件加载失败」已修复**：截屏与 OCR 不再依赖加密文件组件（Keystore），前台服务里构造依赖不会再失败；抓帧不再落盘，更快更稳。
            - **识屏真正打通（关键修复）**：Android 14+ 要求调用截屏 API 前必须有 mediaProjection 类型的前台服务在跑，之前缺这一步 → 授权成功也拿不到投影。现已补齐，并修好截屏监听器线程问题。
            - **识屏失败原因全透明**：新增「识屏自检」页（自动化设置 → 识屏自检 / 查看失败原因）——逐项检查通知权限、截屏授权、截屏、中文 OCR、扣款提取，每项给出结论与修复建议；同时保留最近一次摇一摇识屏的完整步骤与识别文字。
            - **多重提醒**：识屏失败时 Toast 直接说明原因（无授权 / 投影失败 / 取帧超时 / OCR 为空 / 未找到金额…），进度通知标题同样写明原因，并按原因给出下一步怎么做。
            - **缺授权自动续跑**：摇一摇发现没有截屏授权时，自动拉起授权页；授权成功后自动继续识屏，不用再摇第二次。被系统拦下则发「去授权」通知兜底。
            - **识屏从未成功已修复**：OCR 换用中文离线模型（原拉丁模型识别不了中文支付页）；截屏监听器改挂主线程 Looper（原 IO 线程无 Looper，截屏永远超时）。
            - **智能扣款识别**：新算法对整屏文字做候选打分——「实付/付款金额/交易金额」标签、货币符号、支付成功状态加权，订单号/卡号/手机号硬性淘汰；商户按「收款方/商户」标签与后缀词识别，多金额同屏自动选最可能的一笔。
            - **识屏进度可视化（灵动岛适配）**：摇一摇识屏全程投递进行中通知（截屏→识别→提取→结果）；小米焦点通知 / 华为·荣耀实况窗 / OPPO 流体云会自动聚合成屏幕顶部胶囊，其余 ROM 显示通知栏进度。
            - **通知权限专项加固**：所有通知投递统一走安全守卫——未授权通知时先跳过再兜底，杜绝部分机型（尤其国产 ROM）上「开通知权限后闪退 / 主线程被阻塞」的已知问题。
            - **OrangeOS / ColorOS 特调**：新增 ROM 识别与设置页引导卡（自启动 / 通知 / 电池三项必开）；权限弹窗刚关闭时服务启动失败会自动延迟重试，回到设置页也会补拉。
            - **通知渠道冲突修复**：摇一摇常驻通知改用独立低打扰渠道，不再与自动化服务、校对通知抢渠道（修复「有时响铃有时静音」的不稳定表现）。
            - **无障碍服务再加固**：手势兜底通知同样套防崩守卫，杜绝读屏服务因通知异常被系统禁用（Orange 7 实测症状）。
            - **修好「识屏组件不可用」**：摇一摇的识屏改为轻量实现（截屏→OCR→自动预填金额/商家→打开表单确认），不再依赖重型识别管线；识别失败直接打开空表单手动输入。
            - **权限设置不再退出 App**：系统权限页改为在当前任务栈打开，授权完返回直接回到设置页（之前带 NEW_TASK 会新建任务栈，返回就回桌面像退出了一次）。
            - **常驻通知可定制**：专用通知布局，简洁 / 明细 / 大字三种样式；今日支出、本月支出、预算剩余、最近一笔、今日笔数、记一笔按钮、悬浮球显隐都能自己勾。
            - **悬浮球拖拽修正**：跟随手指方向（之前左右相反），拖动后不再误打开表单；通知按钮可快速显示 / 隐藏。
            - **升级自动清理**：清掉旧版本遗留的识屏截图、崩溃日志、过期备份与缓存，不动账单数据。
            - **提示精简**：App 内只留「能做什么」，详细边界见 README。
            - **稳定性**：悬浮层独立进程 + 安全模式熔断，ROM 拦截悬浮球也不会导致 App 打不开。

            ## 能做什么

            - 手动记支出 / 收入 / 转账；按日分组、搜索筛选、周期账单、多账本、分类标签、账户余额联动。
            - 四条本地识别通道：支付完成页读屏、支付通知、银行扣款短信、截屏 OCR；识别不清时弹窗确认。
            - 一键记一笔：桌面图标、小组件、常驻通知、悬浮球、系统手势。
            - 预算、7 个统计视图、CSV / XLSX 导入导出、本地备份恢复；SQLCipher 加密，全本地不联网。

            标准 Android 沙盒内做不到的（全局交易事件、强杀后无条件自启等）没有实现；识别不到时用「记一笔」补记即可。

            ---
            构建：`${{ github.ref_name }}` · `${{ github.sha }}` · 单元测试随 CI 全量执行。
          files: release-asset/bookkeeper-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
