# =============================================================================
# 少花点儿 App — GitHub Actions 云端构建 Debug APK
# -----------------------------------------------------------------------------
# 源码由 git checkout 直接提供：全部 Kotlin 源文件、Gradle 脚本以及
# gradle/wrapper/gradle-wrapper.jar 均已随 git 推送到 main 分支。
# 修改源码后 push 即生效；不要再使用 ci-src 下的 base64 分块解压覆盖源码，
# 否则新提交的修复会被旧分块还原掉，导致 build.log 与磁盘源码不一致。
# "Verify checked-out sources" 步骤会打印实际参与编译的 KSP 版本与
# @HiltWorker 处理器声明，便于从日志直接确认源码来源。
#
# 用户取结果：打开本仓库的 Actions 页 -> 打开本次 workflow run -> Artifacts 区
#   成功时下载 bookkeeper-debug-apk（内含 app-debug.apk）；
#   失败时下载 build-log 中的 build.log，把内容贴回给主理人以便修复源码。
# =============================================================================

name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out sources
        shell: bash
        run: |
          set -euo pipefail
          # checkout 出的 gradlew 显式补可执行位，避免 core.fileMode 差异导致权限丢失
          chmod +x gradlew
          echo "== source tree from git checkout =="
          ls -la | head -n 30
          echo "== KSP version actually used by this build =="
          grep -n '^ksp = "' gradle/libs.versions.toml
          echo "== HiltWorker KSP processor declaration =="
          grep -nE 'androidx[-.]hilt[-.]compiler' gradle/libs.versions.toml app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Static consistency tests (v1.3.13)
        shell: bash
        run: python3 scripts/verify_v1_3_13.py

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Run unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace

      # 统计结果写进 artifact 名：公开 API 无需认证就能读到，方便核对「绿色」是否掩盖失败
      - name: Summarize unit tests
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          summary = "T%d-F%d-E%d-S%d" % (tests, failures, errors, skipped)
          failed_names = []
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed_names.append(case.get("name", "?"))
          if failed_names:
              summary += "-FAIL_" + "_".join(failed_names[:2]).replace(" ", "")[:60]
          print("UNIT TEST SUMMARY:", summary)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("TEST_SUMMARY=%s\n" % summary)
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset
          cp app/build/outputs/apk/debug/app-debug.apk \
             "release-asset/bookkeeper-debug.apk"
          echo "== release asset =="
          ls -lh release-asset/

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.13-debug
          name: 少花点儿 v1.3.13 (Debug APK)
          body: |
            # 少花点儿 v1.3.13

            下载 `bookkeeper-debug.apk`（Android 8.0+）覆盖安装即可，账单不丢。

            ## 排查能力（本版重点）
            - 自检页新增「无障碍事件到达」：今天收到多少条事件、其中多少条来自支付应用、
              最后一条是什么包名。微信里完全没反应时，一眼区分「系统没投事件」和「事件被过滤」。
            - 「存储排查」新增「安装包残留」分类，列出 files/updates 与 cache/incoming-apk 下的 APK；
              识屏日志 capture_log.txt 单独标注。
            - 识屏日志改为默认开启（只存本机，256KB 自滚动），出问题时不再没有现场。
            - 每次回到 App 前台立即体检无障碍：有自动恢复权限就直接写回，没有就发通知提醒。

            ## 重要：识屏通道恢复
            - 恢复「无障碍截屏」能力（canTakeScreenshot）并默认开启。
              v1.2.3 为了降低侧载风控把它关掉了，代价是：微信账单详情这类自绘 / WebView 页面
              读不到任何节点文本时，无障碍截屏与媒体投影两条通道同时不可用，识屏彻底失效。
            - 节点读不到时自动退到截图 OCR（仅支付包名内、15 秒节流），自动识屏与摇一摇都能用。
            - 摇一摇发现两条截图通道都不可用时，主动拉起一次录屏授权；授权后自动继续识屏。
            - 诊断页不再把「无截屏能力」当成预期行为，会明确指出需要重开一次无障碍服务。

            ## 修复
            - 微信 Apple 账单详情识别不出商户：英文公司名被无障碍拆成
              「Apple Distribution International」+「limited」两行 → 现在把纯英文续行拼接后再判断。
            - 「商品」字段是账单链接（apple.com/bill/xxx）时不再当成购买内容，备注不会变成一串 URL。
            - 收款成功页（「你已收款，资金已存入零钱」）和账单详情页此前每笔都进确认队列，
              用户不点就等于没记上 → 读屏已确认页面类型且金额有效时，成功页加成 0.20、
              账单详情页加成 0.10，不再要求必须有商户名。
            - 读屏识别到金额但账户没映射上时（微信零钱、Apple 账单不写付款方式），
              用账本第一个账户兜底，避免恒被判「字段不完整」。
            - 转账 / 收款记录改为**按页面上的记录时间判重**：同一笔反复打开时间一致 → 判定重复；
              不同笔即使金额相同，支付时间 / 转账时间不同 → 正常记账。

            ## 说明
            - 账单时间优先用页面上的「支付时间 / 转账时间 / 收款时间」，不再用识屏时刻。
            - 沿用 v1.3.10：商户名不再变成「全称」；v1.3.9：整行纯数字金额识别。

            ## 优化
            - 沿用 v1.3.9：首页切页与滑动卡顿（分组改为预计算、列表行去掉阴影）。

            ## 说明
            - 拿不到可信商户时宁可不补：备注只写「购买内容」，也不会写错成通道方。
            - 沿用 v1.3.8：红包收发 / 转账双方向 / 云闪付识别、聊天页不再误记账、识屏不可用提醒。

            ## 隐私
            账单数据只存本机，不上传。检查更新只读取公开 Releases。

            反馈请附：机型 + Android 版本 + 自动化设置的「复制 log」。

          files: release-asset/bookkeeper-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 编译失败时把 Kotlin 错误首行写进 artifact 名，公开 API 无需认证即可定位
      - name: Summarize build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          text = ""
          if os.path.isfile("build.log"):
              with open("build.log", encoding="utf-8", errors="ignore") as f:
                  text = f.read()
          errors = re.findall(r"^e: file:///.+$", text, re.M) or re.findall(r"^e: .+", text, re.M)
          if errors:
              matched = re.match(r"^e: file:///(\S+?):(\d+):(\d+): (.*)$", errors[0])
              if matched:
                  msg = "%s_L%s_%s" % (
                      os.path.basename(matched.group(1)), matched.group(2), matched.group(4)[:55]
                  )
              else:
                  msg = errors[0][:200]
          else:
              msg = "unknown-compile-error"
          msg = re.sub(r"[^A-Za-z0-9\u4e00-\u9fff_.\-]", "", msg)[:220]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("BUILD_ERROR=%s\n" % msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Build errors\n\n```\n" + "\n".join(errors[:8]) + "\n```\n")
          print("BUILD ERROR:", msg)
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_ERROR }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ env.TEST_SUMMARY }}
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
