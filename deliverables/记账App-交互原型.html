<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>少花点儿 · 记账 App 高保真交互原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg1:#eef2fb;--bg2:#e3eaf8;
  --page:#f7f9fe;--surface:#ffffff;--surface2:#f0f3fa;--surface3:#e9eef8;
  --text:#1b2440;--dim:#6b7691;--faint:#93a0ba;
  --border:#e2e8f4;--track:#e6ebf5;
  --primary:#4f46e5;--primary-soft:#edecff;--solid:#4f46e5;
  --expense:#ef5b48;--expense-soft:#ffedeb;
  --income:#0a9d87;--income-soft:#e3f7f1;
  --warn:#a85b0a;--warn-soft:#fff4e2;--warn-line:#f0cd93;
  --bezel:#151c2e;
  --shadow:0 20px 50px rgba(30,44,86,.16);
  --card-shadow:0 4px 16px rgba(30,44,86,.06);
}
[data-theme="dark"]{
  --bg1:#0c1120;--bg2:#141d31;
  --page:#111827;--surface:#1c2537;--surface2:#243049;--surface3:#2b3852;
  --text:#eff4ff;--dim:#acb9d2;--faint:#8493b0;
  --border:#30405c;--track:#2c3a54;
  --primary:#9a93ff;--primary-soft:#2b2c56;
  --expense:#ff8a78;--expense-soft:#432527;
  --income:#4ad7b6;--income-soft:#133b36;
  --warn:#fbc65a;--warn-soft:#3a2d13;--warn-line:#6c5422;
  --bezel:#05070e;
  --shadow:0 20px 50px rgba(0,0,0,.55);
  --card-shadow:0 4px 16px rgba(0,0,0,.22);
}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  transition:background .3s,color .3s;
}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;z-index:0}
body::before{width:420px;height:420px;background:#8b9bff;top:-140px;left:-120px}
body::after{width:380px;height:380px;background:#63d9c0;bottom:-160px;right:-110px}
[data-theme="dark"] body::before{opacity:.16}
[data-theme="dark"] body::after{opacity:.13}

.stage{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:26px 20px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,#5b6cf0,#0a9d87);display:grid;place-items:center;color:#fff;box-shadow:0 8px 20px rgba(80,90,220,.32);flex:0 0 auto}
.logo svg{width:26px;height:26px}
.brand h1{font-size:20px;letter-spacing:.2px;font-weight:750}
.brand p{font-size:12px;color:var(--dim);margin-top:4px}
.theme-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:var(--card-shadow);transition:transform .15s,background .25s}
.theme-btn:hover{transform:translateY(-2px)}
.theme-btn svg{width:16px;height:16px}

.pagenav{margin-top:22px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;box-shadow:var(--card-shadow)}
.navlabel{display:block;font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--faint);text-transform:uppercase;margin-bottom:10px}
.navchips{display:flex;flex-wrap:wrap;gap:8px}
.navchip{border:1px solid var(--border);background:var(--surface2);color:var(--dim);padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap}
.navchip:hover{border-color:var(--primary);color:var(--primary)}
.navchip.on{background:var(--solid);border-color:var(--solid);color:#fff;box-shadow:0 6px 14px rgba(79,70,229,.28)}

.readnote{margin-top:12px;font-size:12px;color:var(--dim);line-height:1.75;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend-inline{display:flex;gap:12px;flex-wrap:wrap}
.li{display:inline-flex;align-items:center;gap:5px}
.li-dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.phone-center{display:flex;justify-content:center;margin-top:26px}
.phone{width:390px;height:844px;border-radius:48px;padding:11px;background:linear-gradient(155deg,#2c3652 0%,var(--bezel) 62%);box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.14);flex:0 0 auto;position:relative}
.phone::after{content:"";position:absolute;right:-3px;top:190px;width:3px;height:74px;border-radius:0 3px 3px 0;background:#3d4968}
.screen{width:100%;height:100%;border-radius:38px;background:var(--page);overflow:hidden;position:relative;display:flex;flex-direction:column;transition:background .3s}
.statusbar{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;position:relative;color:var(--text)}
.sb-notch{position:absolute;left:50%;transform:translateX(-50%);top:8px;width:96px;height:22px;border-radius:14px;background:var(--bezel)}
.sb-icons{display:flex;align-items:center;gap:6px}
.content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 16px 96px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}

.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:6px 8px 12px;z-index:15;box-shadow:0 -6px 20px rgba(20,30,60,.05)}
.tab{border:0;background:transparent;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;cursor:pointer;min-width:56px;padding:4px 0;transition:color .2s}
.tab svg{width:21px;height:21px}
.tab.on{color:var(--primary)}
.tab-label{line-height:1.2}
.tab-add{position:relative;top:-16px}
.tabadd-circle{width:48px;height:48px;border-radius:50%;background:linear-gradient(140deg,#5b6cf0,#0a9d87);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(80,90,220,.4);border:3px solid var(--surface)}
.tabadd-circle svg{width:22px;height:22px}
.tab-add .tab-label{color:var(--dim);margin-top:2px}
.fab-layer{position:absolute;right:18px;bottom:94px;z-index:20;pointer-events:none}
.fab{pointer-events:auto;width:52px;height:52px;border-radius:18px;border:0;background:linear-gradient(140deg,#5b6cf0,#4f46e5);color:#fff;font-size:30px;font-weight:300;line-height:1;cursor:pointer;box-shadow:0 10px 22px rgba(79,70,229,.45);transition:transform .18s}
.fab:hover{transform:rotate(90deg) scale(1.06)}

/* ---------- generic ---------- */
.eyebrow{font-size:9.5px;letter-spacing:1.5px;font-weight:800;color:var(--faint);text-transform:uppercase}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:8px 2px 14px}
.page-head h2{font-size:21px;font-weight:750;letter-spacing:.3px;margin-top:3px}
.month-chip,.back-chip{font-size:11.5px;font-weight:650;color:var(--primary);background:var(--primary-soft);border:1px solid transparent;border-radius:999px;padding:7px 11px;white-space:nowrap}
.back-chip{cursor:pointer}
.back-chip:hover{border-color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--card-shadow)}
.card-title{font-size:13px;font-weight:750;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.card-sub{font-size:10.5px;font-weight:500;color:var(--faint)}
.hint{font-size:11px;color:var(--dim);line-height:1.7;margin:2px 3px 14px}
.link-btn{border:0;background:transparent;color:var(--primary);font-size:11px;font-weight:700;cursor:pointer;padding:2px 0}
.link-btn:hover{text-decoration:underline}
.empty-card{padding:30px 16px;text-align:center;color:var(--dim);font-size:12.5px;background:var(--surface);border:1px dashed var(--border);border-radius:16px;margin-bottom:12px}
.btn{border:1px solid transparent;border-radius:12px;padding:11px 16px;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.primary{background:linear-gradient(135deg,#5b6cf0,#4f46e5);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.btn.ghost{background:var(--surface2);border-color:var(--border);color:var(--text)}
.btn.block{display:block;width:100%}
.saved-note{font-size:11px;color:var(--income);text-align:center;margin-top:8px}

/* ---------- home ---------- */
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:var(--card-shadow);position:relative;overflow:hidden}
.ov-card::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;opacity:.13}
.ov-exp::after{background:var(--expense)}
.ov-inc::after{background:var(--income)}
.ov-bal::after{background:var(--primary)}
.ov-top{font-size:11px;color:var(--dim);font-weight:650;display:flex;align-items:center;gap:6px}
.ov-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.ov-exp .ov-dot{background:var(--expense)}
.ov-inc .ov-dot{background:var(--income)}
.ov-bal .ov-dot{background:var(--primary)}
.ov-num{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-top:9px;font-variant-numeric:tabular-nums}
.ov-exp .ov-num{color:var(--expense)}
.ov-inc .ov-num{color:var(--income)}
.ov-bal{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between}
.ov-bal .ov-num{font-size:23px;margin-top:0;color:var(--text)}
.ov-bal .ov-block{display:flex;flex-direction:column}
.ov-sub{font-size:10px;color:var(--faint);margin-top:5px}
.capture-banner{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--primary-soft),var(--income-soft));border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px}
.cb-icon{width:34px;height:34px;border-radius:11px;background:var(--solid);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.cb-icon svg{width:18px;height:18px}
.cb-text{flex:1;min-width:0}
.cb-text b{display:block;font-size:12px;font-weight:750}
.cb-text span{display:block;font-size:10.5px;color:var(--dim);margin-top:2px}
.cb-btn{border:0;background:var(--solid);color:#fff;font-size:11px;font-weight:700;padding:8px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.cb-btn:hover{filter:brightness(1.1)}
.quick-row{display:flex;gap:8px;margin-bottom:14px}
.quick-chip{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--dim);border-radius:11px;padding:9px 4px;font-size:11px;font-weight:650;cursor:pointer;transition:all .18s}
.quick-chip:hover{border-color:var(--primary);color:var(--primary)}
.day-group{margin-bottom:14px}
.day-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--dim);padding:0 3px 7px}
.day-head span:last-child{font-size:10.5px;font-weight:600;color:var(--faint)}
.tx-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 11px;margin-bottom:7px;cursor:pointer;transition:border-color .18s,transform .18s}
.tx-row:hover{border-color:var(--primary);transform:translateX(2px)}
.tx-icon{width:36px;height:36px;border-radius:11px;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto}
.tx-main{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.tx-name{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:10px;color:var(--faint);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tx-amt{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.exp{color:var(--expense)}
.tx-amt.inc{color:var(--income)}
.tx-amt.tr{color:var(--dim)}
.src{font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;white-space:nowrap}
.src-auto{background:var(--primary-soft);color:var(--primary)}
.src-sms{background:var(--income-soft);color:var(--income)}
.src-quick{background:var(--warn-soft);color:var(--warn)}
.src-manual{background:var(--surface3);color:var(--dim)}
.src-import{background:var(--primary-soft);color:var(--primary)}

/* ---------- add ---------- */
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg-btn{flex:1;border:0;background:transparent;color:var(--dim);font-size:12px;font-weight:700;padding:9px 0;border-radius:9px;cursor:pointer;transition:all .18s}
.seg-btn.on{background:var(--surface);color:var(--primary);box-shadow:var(--card-shadow)}
.amount-box{border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#5b6cf0,#4f46e5);color:#fff;margin-bottom:12px;position:relative}
.amount-box.income{background:linear-gradient(135deg,#12b39a,#0a8f7a)}
.amount-box.transfer{background:linear-gradient(135deg,#6173a8,#465789)}
.amount-label{font-size:11px;opacity:.85;font-weight:600}
.amount-line{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.amount-cur{font-size:20px;font-weight:600;opacity:.9}
.amount-value{font-size:36px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.amount-caret{width:2px;height:30px;background:rgba(255,255,255,.75);border-radius:2px;animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.amount-fmt{font-size:10.5px;opacity:.8;margin-top:7px}
.clear-link{position:absolute;right:14px;top:14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;font-size:10px;font-weight:650;padding:5px 9px;border-radius:8px;cursor:pointer}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.key{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;height:44px;font-size:19px;font-weight:700;cursor:pointer;transition:transform .1s,background .15s;display:grid;place-items:center}
.key:hover{border-color:var(--primary);background:var(--primary-soft)}
.key:active{transform:scale(.94)}
.key.fn{color:var(--dim)}
.key svg{width:22px;height:22px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-cell{border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .18s}
.cat-cell:hover{border-color:var(--primary)}
.cat-cell.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 2px var(--primary-soft)}
.cat-glyph{width:30px;height:30px;border-radius:10px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
.cat-name{font-size:11px;font-weight:650;color:var(--text)}
.info-strip{background:var(--primary-soft);color:var(--primary);font-size:11.5px;line-height:1.7;border-radius:11px;padding:11px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fl{font-size:10.5px;font-weight:650;color:var(--dim);display:flex;flex-direction:column;gap:5px}
.fl.full{grid-column:1 / -1}
.fl.missing{color:var(--expense)}
.need{font-size:9.5px;background:var(--expense-soft);color:var(--expense);border-radius:5px;padding:1px 5px;align-self:flex-start;font-weight:700}
.sel,input[type="text"],input[type="date"],input[type="number"],select{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;padding:8px 9px;font-size:11.5px;font-family:inherit;outline:none;transition:border-color .18s}
.sel:focus,input:focus,select:focus{border-color:var(--primary)}
.fl.missing .sel,.fl.missing input{border-color:var(--expense);background:var(--expense-soft)}
.form-title{font-size:10.5px;font-weight:650;color:var(--dim);margin:12px 0 7px}
.src-chips{display:flex;flex-wrap:wrap;gap:6px}
.src-chip{border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-size:10.5px;font-weight:650;padding:6px 10px;border-radius:8px;cursor:pointer}
.src-chip.on{background:var(--solid);border-color:var(--solid);color:#fff}
.save-btn{margin-bottom:12px}

/* ---------- stats ---------- */
.stats-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:none}
.stats-tabs::-webkit-scrollbar{display:none}
.stab{border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-size:11px;font-weight:650;padding:8px 11px;border-radius:9px;white-space:nowrap;cursor:pointer;flex:0 0 auto}
.stab.on{background:var(--solid);border-color:var(--solid);color:#fff}
.donut-wrap{display:flex;justify-content:center;padding:2px 0 8px}
.donut{width:168px;height:168px}
.donut-track{stroke:var(--track)}
.donut-seg{cursor:pointer;transition:opacity .2s}
.donut-seg:hover{opacity:.72}
.donut-t1{fill:var(--dim);font-size:10px;font-weight:600}
.donut-t2{fill:var(--text);font-size:12px;font-weight:800}
.legend{display:flex;flex-direction:column;gap:2px}
.legend-row{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 3px;border-bottom:1px solid var(--border);cursor:pointer;width:100%;text-align:left;color:var(--text)}
.legend-row:last-child{border-bottom:0}
.legend-row:hover{background:var(--surface2)}
.l-dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 auto}
.l-name{font-size:11.5px;font-weight:650;flex:1}
.l-pct{font-size:10.5px;color:var(--faint);width:44px;text-align:right}
.l-val{font-size:11.5px;font-weight:750;width:88px;text-align:right;font-variant-numeric:tabular-nums}
.trend-svg{width:100%;height:auto;display:block}
.grid-line{stroke:var(--border);stroke-dasharray:3 4}
.axis-t{fill:var(--dim);font-size:9px}
.dot-ring{stroke:var(--surface)}
.chart-legend{display:flex;gap:16px;justify-content:center;margin:8px 0}
.cl-item{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);font-weight:650}
.cl-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.trend-caption{background:var(--surface2);border-radius:10px;padding:10px;font-size:11px;color:var(--dim);text-align:center;line-height:1.7}
.trend-caption b{color:var(--text);font-variant-numeric:tabular-nums}
.bar-row{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;padding:9px 2px;cursor:pointer;text-align:left;color:var(--text)}
.bar-row:last-child{border-bottom:0}
.bar-row:hover{background:var(--surface2)}
.bar-row.static{cursor:default}
.bar-label{font-size:11px;font-weight:650;display:flex;align-items:center;gap:6px;width:112px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--track);border-radius:9px;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:9px}
.bar-val{font-size:10.5px;font-weight:700;width:84px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.drill-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.back-btn{border:1px solid var(--border);background:var(--surface2);color:var(--primary);font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
.drill-sum{font-size:11.5px;color:var(--dim);background:var(--surface2);border-radius:9px;padding:9px 11px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.tag-cloud{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.tag-chip{border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-size:10.5px;font-weight:650;padding:7px 10px;border-radius:999px;cursor:pointer}
.tag-chip.on{background:var(--solid);border-color:var(--solid);color:#fff}

/* ---------- automation ---------- */
.cap-card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:11px;margin-bottom:8px}
.cap-glyph{width:34px;height:34px;border-radius:11px;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto}
.cap-body{flex:1;min-width:0}
.cap-name{font-size:12px;font-weight:750}
.cap-desc{font-size:10px;color:var(--dim);line-height:1.5;margin-top:3px}
.perm-mini{font-size:9.5px;color:var(--faint);margin-top:4px}
.switch{width:42px;height:24px;border-radius:999px;border:0;background:var(--track);position:relative;cursor:pointer;flex:0 0 auto;transition:background .22s}
.switch .knob{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:left .22s}
.switch.on{background:var(--primary)}
.switch.on .knob{left:21px}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perm-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px}
.perm-name{font-size:11px;font-weight:700}
.perm-desc{font-size:9.5px;color:var(--dim);line-height:1.5;margin-top:3px;min-height:28px}
.perm-btn{display:inline-block;border:0;background:#d9483a;color:#fff;font-size:10px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer;margin-top:8px}
.perm-btn.ok{background:var(--income-soft);color:var(--income);cursor:default}
.slider-val{font-size:13px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
.range{width:100%;accent-color:var(--primary);cursor:pointer;margin:4px 0 2px}
.range-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);margin-bottom:8px}
.stepper-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 10px}
.sq-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;font-weight:700;cursor:pointer}
.sq-btn:hover{border-color:var(--primary);color:var(--primary)}
.dedup-val{font-size:19px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.boundary{background:var(--warn-soft);border:1px solid var(--warn-line)}
.boundary-head{margin-bottom:8px}
.warn-badge{display:inline-block;background:#b45309;color:#fff;font-size:10px;font-weight:800;letter-spacing:.4px;padding:5px 9px;border-radius:7px}
.boundary-lead{font-size:11.5px;line-height:1.75;color:var(--text);margin-bottom:9px}
.boundary-lead strong{color:var(--warn)}
.boundary-list{padding-left:17px;display:flex;flex-direction:column;gap:8px}
.boundary-list li{font-size:11px;line-height:1.7;color:var(--text)}
.boundary-list b{color:var(--warn)}
.boundary-foot{margin-top:10px;border-top:1px solid var(--warn-line);padding-top:9px;font-size:10.5px;color:var(--text);line-height:1.7;font-weight:650}

/* ---------- import wizard ---------- */
.stepper{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step-chip{flex:0 0 auto;border:1px solid var(--border);background:var(--surface2);color:var(--dim);border-radius:10px;padding:7px 8px;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:650;cursor:pointer;white-space:nowrap}
.step-chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.step-chip.done{color:var(--income)}
.step-num{width:16px;height:16px;border-radius:50%;background:var(--track);color:var(--dim);display:grid;place-items:center;font-size:9.5px;font-weight:800}
.step-chip.on .step-num{background:var(--solid);color:#fff}
.step-chip.done .step-num{background:var(--income);color:#fff}
.src-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:10px;margin-bottom:7px;cursor:pointer;color:var(--text)}
.src-card.on{border-color:var(--primary);background:var(--primary-soft)}
.src-glyph{width:32px;height:32px;border-radius:10px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.src-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.src-name{font-size:11.5px;font-weight:750}
.src-desc{font-size:10px;color:var(--dim)}
.radio{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);flex:0 0 auto}
.radio.on{border-color:var(--primary);box-shadow:inset 0 0 0 3px var(--surface);background:var(--primary)}
.upload-zone{border:1.5px dashed var(--border);border-radius:14px;padding:20px 12px;text-align:center;background:var(--surface2)}
.upload-icon{width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 9px;font-size:22px;font-weight:600}
.upload-title{font-size:12px;font-weight:700}
.upload-sub{font-size:10px;color:var(--dim);margin-top:4px}
.upload-btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.file-card{display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:9px;margin-top:10px}
.file-glyph{width:30px;height:30px;border-radius:9px;background:var(--income-soft);color:var(--income);display:grid;place-items:center;font-size:12px;font-weight:800}
.file-card>div{flex:1;min-width:0}
.file-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:9.5px;color:var(--dim);margin-top:2px}
.file-x{border:0;background:transparent;color:var(--dim);font-size:18px;cursor:pointer;padding:0 4px}
.map-table{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:10px}
.map-row{display:grid;grid-template-columns:1fr 22px 1.25fr;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border)}
.map-row:last-child{border-bottom:0}
.map-head{background:var(--surface2);font-size:9.5px;font-weight:750;color:var(--faint)}
.map-col{font-size:11px;font-weight:650}
.map-arrow{text-align:center;color:var(--primary);font-weight:800}
.preview-table{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:10px}
.pv-row{display:grid;grid-template-columns:1.05fr .85fr 1fr .7fr;gap:5px;padding:8px 9px;font-size:10px;border-bottom:1px solid var(--border);align-items:center}
.pv-row:last-child{border-bottom:0}
.pv-head{background:var(--surface2);font-weight:750;color:var(--faint);font-size:9.5px}
.pv-row.fail{background:var(--expense-soft);color:var(--expense)}
.pv-badge{font-size:9px;font-weight:800;background:#d9483a;color:#fff;border-radius:5px;padding:2px 5px}
.pv-badge.ok{background:var(--income-soft);color:var(--income)}
.fail-reason{font-size:9.5px;color:var(--expense);background:var(--expense-soft);padding:5px 10px;border-bottom:1px solid var(--border);line-height:1.5}
.check-line{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);cursor:pointer;margin-bottom:8px}
.check-line input{accent-color:var(--primary)}
.sum-list{display:flex;flex-direction:column;gap:2px}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--dim)}
.sum-row:last-child{border-bottom:0}
.sum-row b{color:var(--text);font-weight:750;font-variant-numeric:tabular-nums}
.wizard-foot{display:flex;justify-content:space-between;gap:10px;margin:14px 0 4px}
.wizard-foot .btn{flex:1}

/* ---------- accounts / budget / settings / ledger / mine ---------- */
.asset-hero{background:linear-gradient(135deg,#5b6cf0,#4f46e5);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.asset-label{font-size:11px;opacity:.85}
.asset-num{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-top:7px;font-variant-numeric:tabular-nums}
.asset-sub{font-size:10px;opacity:.8;margin-top:6px}
.acct-row{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:10px;margin-bottom:7px;cursor:pointer;color:var(--text);text-align:left}
.acct-row.on{border-color:var(--primary);background:var(--primary-soft)}
.acct-glyph{width:32px;height:32px;border-radius:10px;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.acct-name{font-size:11.5px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-num{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.acct-num.neg{color:var(--expense)}
.detail-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.progress{height:8px;background:var(--track);border-radius:9px;overflow:hidden;margin-top:8px}
.progress.big{height:11px;margin-top:12px}
.progress-fill{display:block;height:100%;border-radius:9px}
.bud-top{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:7px;font-variant-numeric:tabular-nums}
.bud-row{padding:9px 2px;border-bottom:1px solid var(--border)}
.bud-row:last-child{border-bottom:0}
.budget-edit{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.budget-edit input{flex:1;min-width:100px}
.set-group{padding:2px 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-name{font-size:12px;font-weight:700}
.set-desc{font-size:10px;color:var(--dim);line-height:1.5;margin-top:3px}
.set-btn{border:1px solid var(--border);background:var(--surface2);color:var(--primary);font-size:10.5px;font-weight:700;padding:7px 10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.set-btn.static{color:var(--income);cursor:default}
.ledger-card{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:13px;padding:11px;margin-bottom:8px;cursor:pointer;color:var(--text);text-align:left}
.ledger-card.on{border-color:var(--primary);background:var(--primary-soft)}
.ledger-glyph{width:36px;height:36px;border-radius:11px;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:0 0 auto}
.ledger-text{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.ledger-name{font-size:12px;font-weight:750}
.ledger-meta{font-size:10px;color:var(--dim)}
.badge-current{font-size:9px;background:var(--solid);color:#fff;border-radius:5px;padding:2px 5px;font-weight:700;margin-left:5px}
.ledger-arrow{font-size:20px;color:var(--faint)}
.profile{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,#5b6cf0,#0a9d87);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800;flex:0 0 auto}
.profile-name{font-size:15px;font-weight:750}
.profile-sub{font-size:10.5px;color:var(--dim);margin-top:4px}
.profile>div:nth-child(2){flex:1}
.entry-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.entry{border:1px solid var(--border);background:var(--surface);border-radius:13px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .15s}
.entry:hover{transform:translateY(-2px);border-color:var(--primary)}
.entry-glyph{width:34px;height:34px;border-radius:11px;color:#fff;display:grid;place-items:center}
.entry-glyph svg{width:18px;height:18px}
.entry-name{font-size:10.5px;font-weight:650;color:var(--text)}

/* ---------- modal / toast ---------- */
.modal-layer{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(8,12,24,.55)}
.modal-card{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:11px}
.modal-top h3{font-size:17px;font-weight:750;margin-top:3px}
.x-btn{border:0;background:var(--surface2);color:var(--dim);width:28px;height:28px;border-radius:9px;font-size:18px;cursor:pointer;line-height:1}
.conf-bar{display:flex;align-items:center;gap:7px;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:10px;padding:9px;margin-bottom:10px;font-size:10.5px;color:var(--dim);flex-wrap:wrap}
.conf-bar .low{color:var(--expense);font-size:14px;font-weight:800}
.conf-note{margin-left:auto}
.raw-card{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:12px}
.raw-title{font-size:9.5px;font-weight:750;color:var(--faint);letter-spacing:.5px}
.raw-text{font-size:13px;font-weight:650;margin-top:6px;line-height:1.6}
.raw-text b{color:var(--expense)}
.raw-meta{font-size:9.5px;color:var(--dim);margin-top:6px;line-height:1.6}
.modal-actions{display:flex;gap:9px;margin-top:13px}
.modal-actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:#1e2740;color:#fff;font-size:12.5px;font-weight:600;padding:12px 18px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;max-width:88vw;text-align:center;line-height:1.6}
.toast.show{opacity:1;transform:translate(-50%,0)}
[data-theme="dark"] .toast{background:#39456a}

.footer-note{margin-top:20px;text-align:center;font-size:11.5px;color:var(--dim);line-height:1.8}
.footer-note b{color:var(--text)}
@media (max-width:440px){
  .stage{padding:16px 10px 30px}
  .phone{transform:scale(.9);transform-origin:top center}
  .phone-center{margin-bottom:-84px}
}
</style>

/* ==================== 工具函数 ==================== */
function esc(s){
  return String(s===null || s===undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function groupInt(s){
  var out='',c=0,i;
  for(i=s.length-1;i>=0;i--){out=s.charAt(i)+out;c++;if(c%3===0 && i>0)out=','+out;}
  return out;
}
function money(n){
  var neg=n<0,p=Math.abs(n).toFixed(2).split('.');
  return (neg?'-¥':'¥')+groupInt(p[0])+'.'+p[1];
}
function signed(n,type){
  var sign=type==='income'?'+':(type==='transfer'?'':'-');
  return sign+money(n);
}
function svgIcon(k){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[k]||'')+'</svg>';
}
function dateLabel(d){
  if(d==='2026-11-22')return '今天 · 11 月 22 日';
  if(d==='2026-11-21')return '昨天 · 11 月 21 日';
  var p=d.split('-');
  return Number(p[1])+' 月 '+Number(p[2])+' 日';
}
function catColor(name,type){
  var arr=type==='income'?INCOME_CATS:EXPENSE_CATS,i=arr.indexOf(name);
  return PALETTE[(i<0?0:i)%PALETTE.length];
}
function srcBadge(s){
  return '<span class="src '+(SOURCE_CLASS[s]||'src-manual')+'" title="账单来源：'+esc(s)+'">'+esc(s)+'</span>';
}
function currentTx(){
  return state.transactions.filter(function(t){return t.ledger===state.activeLedger;});
}
function totals(list){
  var exp=0,inc=0;
  list.forEach(function(t){if(t.type==='expense')exp+=t.amount;else if(t.type==='income')inc+=t.amount;});
  return {exp:exp,inc:inc,bal:inc-exp};
}

/* ==================== 图表（手写内联 SVG） ==================== */
function donutSVG(items,total,t1,t2){
  var r=58,cx=80,cy=80,c=2*Math.PI*r,off=0;
  var segs=items.map(function(it){
    var len=total>0?(it.value/total)*c:0;
    var s='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+it.color+'" stroke-width="24" '+
      'stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" '+
      'transform="rotate(-90 '+cx+' '+cy+')" class="donut-seg" data-action="drill" data-cat="'+esc(it.name)+'">'+
      '<title>'+esc(it.name)+' '+money(it.value)+' · 点击下钻</title></circle>';
    off+=len;
    return s;
  }).join('');
  return '<svg viewBox="0 0 160 160" class="donut" role="img" aria-label="'+esc(t1)+'">'+
    '<circle cx="80" cy="80" r="58" fill="none" stroke-width="24" class="donut-track"/>'+segs+
    '<text x="80" y="74" text-anchor="middle" class="donut-t1">'+esc(t1)+'</text>'+
    '<text x="80" y="95" text-anchor="middle" class="donut-t2">'+esc(t2)+'</text></svg>';
}
function legendHTML(items,total){
  return items.map(function(it){
    return '<button class="legend-row" data-action="drill" data-cat="'+esc(it.name)+'" title="下钻查看 '+esc(it.name)+' 明细">'+
      '<i class="l-dot" style="background:'+it.color+'"></i>'+
      '<span class="l-name">'+esc(it.name)+'</span>'+
      '<span class="l-pct">'+(total>0?(it.value/total*100).toFixed(1):'0.0')+'%</span>'+
      '<span class="l-val">'+money(it.value)+'</span></button>';
  }).join('');
}
function trendSVG(data){
  var W=320,H=170,padL=34,padR=12,padT=14,padB=26;
  var max=Math.max.apply(null,data.map(function(d){return Math.max(d.e,d.i);}))*1.15||1;
  var x=function(i){return padL+i*((W-padL-padR)/(data.length-1));};
  var y=function(v){return padT+(1-v/max)*(H-padT-padB);};
  var poly=function(key){return data.map(function(d,i){return x(i).toFixed(1)+','+y(d[key]).toFixed(1);}).join(' ');};
  var grid=[0,0.25,0.5,0.75,1].map(function(f){
    var gy=padT+f*(H-padT-padB),val=max*(1-f);
    return '<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+gy.toFixed(1)+'" class="grid-line"/>'+
      '<text x="'+(padL-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" class="axis-t">'+Math.round(val/1000)+'k</text>';
  }).join('');
  var labels=data.map(function(d,i){return '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" class="axis-t">'+d.m+'</text>';}).join('');
  var dots=function(key,color){return data.map(function(d,i){
    return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(d[key]).toFixed(1)+'" r="4.5" fill="'+color+'" '+
      'class="dot-ring" stroke-width="2" data-action="trend-point" data-i="'+i+'" style="cursor:pointer">'+
      '<title>'+d.m+' '+(key==='e'?'支出':'收入')+' '+money(d[key])+'</title></circle>';
  }).join('');};
  return '<svg viewBox="0 0 '+W+' '+H+'" class="trend-svg" role="img" aria-label="月度收支趋势">'+grid+labels+
    '<polyline points="'+poly('i')+'" fill="none" stroke="#0f9f8a" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<polyline points="'+poly('e')+'" fill="none" stroke="#ef6a52" stroke-width="2.5" stroke-linejoin="round"/>'+
    dots('i','#0f9f8a')+dots('e','#ef6a52')+'</svg>';
}

/* ==================== 视图：统计报表 ==================== */
function pieBlock(title,items,total){
  if(!items.length)return emptyCard('当前账本暂无'+title+'数据');
  return '<div class="card"><div class="card-title">'+title+'分类占比 <span class="card-sub">点击圆环或图例可下钻</span></div>'+
    '<div class="donut-wrap">'+donutSVG(items,total,title+'合计',money(total))+'</div>'+
    '<div class="legend">'+legendHTML(items,total)+'</div></div>'+
    '<div class="hint">共 '+items.length+' 个分类 · 合计 '+money(total)+'</div>';
}
function drillPanel(){
  var c=state.drillCategory;
  var rows=currentTx().filter(function(t){return t.category===c;});
  var sum=rows.reduce(function(s,t){return s+t.amount;},0);
  return '<div class="card drill"><div class="drill-head">'+
    '<button class="back-btn" data-action="drill-back" title="返回图表">‹ 返回</button><b>'+esc(c)+' · 明细</b></div>'+
    '<div class="drill-sum">共 '+rows.length+' 笔 · 合计 '+money(sum)+'</div>'+
    (rows.length?rows.map(txRow).join(''):'<div class="empty-card">该分类下暂无账单</div>')+'</div>'+
    '<div class="hint">明细来自首页账单数据；点任意一行可查看该笔详情。</div>';
}
function trendBlock(){
  var t=totals(currentTx());
  var data=TREND.map(function(d,i){return i===TREND.length-1?{m:d.m,e:t.exp,i:t.inc}:d;});
  var p=data[state.trendPoint]||data[data.length-1];
  return '<div class="card"><div class="card-title">近 6 个月收支趋势 <span class="card-sub">点击圆点查看当月</span></div>'+
    trendSVG(data)+
    '<div class="chart-legend"><span class="cl-item"><i class="cl-dot" style="background:#ef6a52"></i>支出</span>'+
    '<span class="cl-item"><i class="cl-dot" style="background:#0f9f8a"></i>收入</span></div>'+
    '<div class="trend-caption">'+p.m+' · 支出 <b>'+money(p.e)+'</b> · 收入 <b>'+money(p.i)+'</b> · 结余 <b>'+money(p.i-p.e)+'</b></div></div>'+
    '<div class="hint">11 月数据随首页账单实时联动；其余月份为演示样本。</div>';
}
function catDetailBlock(items,total){
  if(!items.length)return emptyCard('当前账本暂无支出数据');
  return '<div class="card"><div class="card-title">支出分类明细 <span class="card-sub">点击行下钻</span></div>'+
    items.map(function(it){
      return '<button class="bar-row" data-action="drill" data-cat="'+esc(it.name)+'" title="下钻查看 '+esc(it.name)+' 明细">'+
        '<span class="bar-label"><i class="l-dot" style="background:'+it.color+'"></i>'+esc(it.name)+'</span>'+
        '<span class="bar-track"><span class="bar-fill" style="width:'+(it.value/total*100).toFixed(1)+'%;background:'+it.color+'"></span></span>'+
        '<span class="bar-val">'+money(it.value)+'</span></button>';
    }).join('')+'</div><div class="hint">合计 '+money(total)+' · 分类金额由首页账单实时聚合。</div>';
}
function accountStatsBlock(){
  var max=Math.max.apply(null,ACCOUNT_BALANCES.map(function(a){return Math.abs(a.bal);}))||1;
  return '<div class="card"><div class="card-title">账户余额分布</div>'+
    ACCOUNT_BALANCES.map(function(a){
      return '<div class="bar-row static" data-action="noop" data-msg="账户资产详情见「账户资产」页" title="'+esc(a.name)+'：'+money(a.bal)+'">'+
        '<span class="bar-label">'+esc(a.name)+'</span>'+
        '<span class="bar-track"><span class="bar-fill" style="width:'+(Math.abs(a.bal)/max*100).toFixed(1)+'%;background:'+a.color+'"></span></span>'+
        '<span class="bar-val">'+money(a.bal)+'</span></div>';
    }).join('')+'</div>'+
    '<div class="hint">净资产合计 '+money(ACCOUNT_BALANCES.reduce(function(s,a){return s+a.bal;},0))+' · 含 1 笔待还信用卡。</div>';
}
function tagBlock(){
  var tags=tagStats();
  var sel=state.tag?tags.filter(function(x){return x.n===state.tag;})[0]:null;
  return '<div class="card"><div class="card-title">标签 / 来源聚合 <span class="card-sub">点击标签查看明细</span></div>'+
    '<div class="tag-cloud">'+tags.map(function(x){
      return '<button class="tag-chip '+(state.tag===x.n?'on':'')+'" data-action="tag-pick" data-tag="'+esc(x.n)+'" title="'+esc(x.n)+'：'+x.c+' 笔">'+esc(x.n)+' · '+x.c+'</button>';
    }).join('')+'</div>'+
    (sel?'<div class="drill-sum">'+esc(sel.n)+'：'+sel.c+' 笔 · 合计 '+money(sel.v)+'</div>'+
      '<button class="btn ghost block" data-action="go" data-page="home" title="返回首页查看全部账单">返回首页查看账单</button>'
      :'<div class="hint">选择一个标签查看汇总；标签统计随首页账单实时变化。</div>')+'</div>';
}
function renderStats(){
  var tabs=STATS_TABS.map(function(p){
    return '<button class="stab '+(state.statsTab===p[0]?'on':'')+'" data-action="stats-tab" data-tab="'+p[0]+'" title="'+p[1]+'">'+p[1]+'</button>';
  }).join('');
  var list=currentTx(),t=totals(list);
  var exp=groupByCategory('expense'),inc=groupByCategory('income');
  var body;
  if((state.statsTab==='expPie'||state.statsTab==='incPie'||state.statsTab==='catDetail')&&state.drillCategory){
    body=drillPanel();
  }else if(state.statsTab==='overview'){
    body='<div class="ov-grid">'+
      '<div class="ov-card ov-exp"><div class="ov-top"><i class="ov-dot"></i>支出</div><div class="ov-num">'+money(t.exp)+'</div></div>'+
      '<div class="ov-card ov-inc"><div class="ov-top"><i class="ov-dot"></i>收入</div><div class="ov-num">'+money(t.inc)+'</div></div>'+
      '<div class="ov-card ov-bal"><div class="ov-block"><div class="ov-top"><i class="ov-dot"></i>结余</div><div class="ov-sub">'+list.length+' 笔账单</div></div><div class="ov-num">'+money(t.bal)+'</div></div></div>'+
      '<div class="card"><div class="card-title">支出结构 <button class="link-btn" data-action="stats-tab" data-tab="expPie" title="查看完整支出饼图">查看全部 ›</button></div>'+
      (exp.length?'<div class="donut-wrap">'+donutSVG(exp,t.exp,'支出',money(t.exp))+'</div><div class="legend">'+legendHTML(exp.slice(0,4),t.exp)+'</div>':emptyCard('暂无支出数据'))+'</div>'+
      '<div class="hint">本月共 '+list.length+' 笔账单 · 支出 '+money(t.exp)+' · 收入 '+money(t.inc)+'。下方 7 个页签可逐个查看。</div>';
  }else if(state.statsTab==='expPie'){body=pieBlock('支出',exp,t.exp);}
  else if(state.statsTab==='incPie'){body=pieBlock('收入',inc,t.inc);}
  else if(state.statsTab==='trend'){body=trendBlock();}
  else if(state.statsTab==='catDetail'){body=catDetailBlock(exp,t.exp);}
  else if(state.statsTab==='accounts'){body=accountStatsBlock();}
  else{body=tagBlock();}
  return '<div class="page-head"><div><div class="eyebrow">STATISTICS · 报表</div><h2>统计报表</h2></div>'+
    '<span class="month-chip" title="统计区间：2026 年 11 月">2026 年 11 月</span></div>'+
    '<div class="stats-tabs">'+tabs+'</div>'+body;
}

          '<span class="radio '+(state.importSource===s.n?'on':'')+'"></span></button>';
      }).join('')+'<div class="hint">真实 App 中使用 kotlin-csv / POI 解析，导入前统一转换为标准交易模型。</div></div>';

    var bad=PREVIEW_ROWS.filter(function(r){return r.fail;}).length;
    return '<div class="card"><div class="card-title">预览校对 <span class="card-sub">失败行标红</span></div>'+

function render(){
  var c=document.getElementById('content'),keep=c.scrollTop;
  c.innerHTML=(VIEWS[state.page]||renderHome)();
  c.scrollTop=keep;
  document.getElementById('tabbar').innerHTML=tabbarHTML();
  document.getElementById('navChips').innerHTML=navHTML();
  document.getElementById('fabLayer').innerHTML=(state.page==='home'&&!state.review.open)
    ? '<button class="fab" data-action="go" data-page="add" title="记一笔 / 快捷补记">+</button>':'';
  var ml=document.getElementById('modalLayer');
  ml.innerHTML=modalHTML();
  ml.style.display=state.review.open?'flex':'none';
  document.documentElement.setAttribute('data-theme',state.dark?'dark':'light');
  document.getElementById('themeLabel').textContent=state.dark?'浅色模式':'深色模式';
}
var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show');},2800);
}
function go(page){
  if(page==='review'){
    state.review.open=true;
    if(state.page!=='home')state.page='home';
    render();
    toast('低置信度校对队列：1 条待人工确认');
    return;
  }
  state.page=page;
  state.review.open=false;
  render();
}
function toggleTheme(){
  state.dark=!state.dark;
  render();
  toast(state.dark?'已切换到深色主题':'已切换到浅色主题');
}
function pressKey(k){
  var a=state.amount;
  if(k==='back'){a=a.length<=1?'0':a.slice(0,-1);}
  else if(k==='.'){if(a.indexOf('.')<0)a=a+'.';else return;}
  else{
    if(a==='0')a=k;
    else if(a.indexOf('.')>=0&&a.split('.')[1].length>=2)return;
    else if(a.length>=10)return;
    else a=a+k;
  }
  state.amount=a;
  render();
}
function nowTime(){
  var d=new Date();
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function saveTx(){
  var amt=parseFloat(state.amount);
  if(!(amt>0)){toast('请先输入大于 0 的金额再保存');return;}
  var ty=state.txType;
  var cat=ty==='transfer'?'转账':state.category;
  var merchant=state.addMerchant.trim()||(ty==='income'?'收入一笔':cat);
  state.transactions.unshift({
    id:'tx'+Date.now(),date:state.addDate||'2026-11-22',time:nowTime(),
    merchant:merchant,category:cat,amount:amt,type:ty,source:state.addSource,
    icon:merchant.charAt(0),ledger:state.activeLedger
  });
  state.amount='0';state.addMerchant='';state.addNote='';
  go('home');
  toast('已保存 '+money(amt)+'：首页列表与三张概览卡已更新');
}
function reviewConfirm(){
  var r=state.review,amt=parseFloat(r.amount);
  if(!(amt>0)){toast('金额无效，请修正后再确认');return;}
  if(!r.merchant.trim()){toast('请先补充「商家」字段');return;}
  if(!r.category){toast('请先补充「分类」字段');return;}
  state.transactions.unshift({
    id:'rv'+Date.now(),date:'2026-11-22',time:'19:23',
    merchant:r.merchant.trim(),category:r.category,amount:amt,type:r.type,
    source:'OCR 识别',icon:r.merchant.trim().charAt(0),ledger:state.activeLedger
  });
  state.review={open:false,merchant:'',category:'',amount:'68.00',note:'',type:'expense'};
  state.page='home';
  render();
  toast('已确认入账：首页新增 1 笔，概览数字已更新');
}

function handleField(el){
  var f=el.dataset.field;
  if(!f)return;
  if(f==='confidence'){
    state.confidence=parseFloat(el.value);
    var o=document.getElementById('confVal');
    if(o)o.textContent=state.confidence.toFixed(2);
  }else if(f==='rv-amount'){state.review.amount=el.value;}
  else if(f==='rv-merchant'){state.review.merchant=el.value;}
  else if(f==='rv-note'){state.review.note=el.value;}
  else if(f==='rv-category'){state.review.category=el.value;}
  else if(f==='rv-type'){state.review.type=el.value;state.review.category='';render();}
  else if(f==='add-merchant'){state.addMerchant=el.value;}
  else if(f==='add-note'){state.addNote=el.value;}
  else if(f==='add-date'){state.addDate=el.value;}
  else if(f==='add-account'){state.addAccount=el.value;}
  else if(f==='add-target'){state.addTarget=el.value;}
  else if(f==='budget-total'){state.budgetDraft=el.value;}
  else if(f==='map'){state.importMap[Number(el.dataset.i)]=el.value;render();}
  else if(f==='import-skip'){state.importSkipFailed=el.checked;render();}
}
function onClick(e){
  if(!e.target||!e.target.closest)return;
  var el=e.target.closest('[data-action]');
  if(!el)return;
  var a=el.dataset.action,k=el.dataset.key;
  switch(a){
    case 'go':go(el.dataset.page);break;
    case 'theme':toggleTheme();break;
    case 'ledger-info':toast('当前账本：'+state.activeLedger+'（可在「账本」页切换）');break;
    case 'review-close':state.review.open=false;render();break;
    case 'review-close-mask':
      if(e.target.closest('.modal-card'))return;
      state.review.open=false;render();break;
    case 'review-discard':
      state.review={open:false,merchant:'',category:'',amount:'68.00',note:'',type:'expense'};
      render();toast('已丢弃该候选（未入账）');break;
    case 'review-confirm':reviewConfirm();break;
    case 'tx-detail':{
      var t=state.transactions.filter(function(x){return x.id===el.dataset.id;})[0];
      if(t)toast(t.merchant+' · '+t.category+' · '+t.time+' · '+signed(t.amount,t.type)+' · 来源：'+t.source);
      break;
    }
    case 'set-type':{
      var ty=el.dataset.type;
      state.txType=ty;
      state.category=ty==='income'?INCOME_CATS[0]:(ty==='transfer'?'转账':EXPENSE_CATS[0]);
      render();break;
    }
    case 'key':pressKey(el.dataset.key);break;
    case 'clear-amount':state.amount='0';render();break;
    case 'pick-cat':state.category=el.dataset.cat;render();break;
    case 'pick-source':state.addSource=el.dataset.src;render();break;
    case 'save-tx':saveTx();break;
    case 'stats-tab':state.statsTab=el.dataset.tab;state.drillCategory=null;render();break;
    case 'drill':state.drillCategory=el.dataset.cat;render();toast('已下钻：'+el.dataset.cat);break;
    case 'drill-back':state.drillCategory=null;render();break;
    case 'trend-point':state.trendPoint=Number(el.dataset.i);render();break;
    case 'tag-pick':state.tag=el.dataset.tag;render();break;
    case 'toggle-auto':state.auto[k]=!state.auto[k];render();break;
    case 'grant-perm':state.perms[k]=true;render();toast('权限已标记为已授予（原型模拟）');break;
    case 'dedup-minus':state.dedup=Math.max(0,state.dedup-30);render();break;
    case 'dedup-plus':state.dedup=Math.min(600,state.dedup+30);render();break;
    case 'auto-save':state.autoSavedAt='20:57';render();toast('自动化设置已保存（原型内存）');break;
    case 'import-source':state.importSource=el.dataset.src;render();break;
    case 'pick-file':document.getElementById('fileInput').click();break;
    case 'use-sample':state.importFile='账单_2026-11.csv';render();toast('已载入示例文件：账单_2026-11.csv');break;
    case 'clear-file':state.importFile='';render();toast('已移除文件');break;
    case 'import-step':state.importStep=Number(el.dataset.step);render();break;
    case 'import-next':
      if(state.importStep===1&&!state.importFile){toast('请先选择文件或点「使用示例文件」');break;}
      state.importStep=Math.min(4,state.importStep+1);render();break;
    case 'import-confirm':importConfirm();break;
    case 'account-pick':state.selectedAccount=el.dataset.name;render();break;
    case 'account-default':state.addAccount=el.dataset.name;render();toast('已设为默认付款账户：'+el.dataset.name);break;
    case 'budget-edit':state.budgetEditing=true;state.budgetDraft=String(state.budgetTotal);render();break;
    case 'budget-save':{
      var v=parseFloat(state.budgetDraft);
      if(!(v>0)){toast('请输入大于 0 的预算金额');break;}
      state.budgetTotal=v;state.budgetEditing=false;render();toast('月度总预算已更新为 '+money(v));break;
    }
    case 'budget-cancel':state.budgetEditing=false;render();break;
    case 'toggle-setting':state.settings[k]=!state.settings[k];render();break;
    case 'setting-action':toast(el.dataset.msg||'该项在原型中仅作展示');break;
    case 'ledger-pick':state.activeLedger=el.dataset.name;state.page='home';render();toast('已切换账本：'+el.dataset.name+'，首页与概览已按账本过滤');break;
    case 'ledger-new':{
      state.ledgers.push('自定义账本 '+(state.ledgers.length-2));
      state.activeLedger=state.ledgers[state.ledgers.length-1];
      render();toast('已新建并切换到：'+state.activeLedger);break;
    }
    case 'noop':toast(el.dataset.msg||'该项仅为展示，无副作用');break;
    default:break;
  }
}

document.addEventListener('click',onClick);
document.addEventListener('input',function(e){handleField(e.target);});
document.addEventListener('change',function(e){handleField(e.target);});
document.getElementById('fileInput').addEventListener('change',function(){
  var f=this.files&&this.files[0];
  state.importFile=f?f.name:'账单_2026-11.csv';
  render();
  toast('已选择文件：'+state.importFile);
});
render();
</script>
</body>
</html>
