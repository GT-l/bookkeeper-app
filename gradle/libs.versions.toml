[versions]
agp = "8.5.2"
kotlin = "2.0.21"
# Kotlin 2.0.21 必须与同前缀的 KSP 配对。1.0.25 在处理 Hilt 2.51.x 生成的 Java
# 符号（*_HiltModules.BindsModule 的超级接口）时存在 Java 类型解析 NPE
# （ResolverImpl.resolveJavaType -> ClassDescriptor 强转失败），后续 109 个
# error.NonExistentClass 均为该 NPE 的连锁。1.0.26 起修复了一批 Java source
# 解析缺陷，1.0.28 是 Kotlin 2.0.21 + Hilt 2.51.1 社区/官方示例的验证组合。
ksp = "2.0.21-1.0.28"
hilt = "2.51.1"
androidxHilt = "1.2.0"
composeBom = "2024.09.02"
navigation = "2.7.7"
lifecycle = "2.8.2"
coreKtx = "1.13.1"
activityCompose = "1.9.2"
room = "2.6.1"
sqlcipher = "4.5.5"
datastore = "1.1.1"
work = "2.9.1"
coroutines = "1.8.1"
serialization = "1.6.3"
mlkit = "16.0.1"
mpandroidchart = "3.1.0"
kotlinCsv = "1.9.3"
poi = "5.2.5"
coil = "2.6.0"
glance = "1.1.0"
biometric = "1.1.0"
fragment = "1.8.4"
securityCrypto = "1.1.0-alpha06"
timber = "5.0.1"
desugar = "2.0.4"
junit = "4.13.2"
mockk = "1.13.12"
turbine = "1.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
# @HiltWorker 的 KSP 处理器：与 hilt-work 1.2.0 同版本，负责生成 WorkerFactory
# 所需的 assisted factory 绑定；只有 com.google 的 hilt-android-compiler 时
# HiltWorkerFactory 在 Dagger 图中无绑定。
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit" }
mpandroidchart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpandroidchart" }
kotlin-csv-jvm = { module = "com.github.doyaaaaaken:kotlin-csv-jvm", version.ref = "kotlinCsv" }
# 完整 XSSF API（XSSFWorkbook / SXSSFWorkbook / OPCPackage / DataFormatter 等）只在
# poi-ooxml 中；poi-ooxml-lite 仅含精简 schema，无法解析这些类。poi-ooxml 已把
# poi 与 poi-ooxml-lite 作为传递依赖，故这里只保留完整 artifact，避免两者并存冲突。
poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "poi" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
